<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>例文の音声チェック</title>
<style>
:root{--bg:#FBF7EF;--card:#fff;--ink:#2A2430;--mut:#7A7080;--line:#E8DFD0;--acc:#1E8496;--ng:#C0392B;--ok:#2E8656}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 16px;z-index:5}
h1{font-size:1.1rem;margin:0 0 8px}
.tabs,.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctl{margin-top:8px}
button{font:inherit;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.small{font-size:.8rem;color:var(--mut)}
main{padding:12px 16px 80px;max-width:760px;margin:0 auto}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.row.now{border-color:#F2B630;box-shadow:0 0 0 3px #FFE9A8}
.row.ng{border-color:var(--ng);background:#FFF1EF}
.k{font-size:1.3rem;font-weight:700;min-width:1.6em;text-align:center}
.s{font-size:1.05rem;line-height:2}
.s rt{font-size:.55em;color:var(--mut)}
.n{font-size:.7rem;color:var(--mut)}
.b{display:flex;gap:4px}
.b button{padding:4px 10px}
.mark{border-color:var(--line)}
.row.ng .mark{background:var(--ng);color:#fff;border-color:var(--ng)}
textarea{width:100%;box-sizing:border-box;min-height:120px;margin-top:8px;font:inherit}
</style></head><body>
<header>
<h1>例文の音声チェック（確認用）</h1>
<div class="tabs" id="tabs"></div>
<div class="ctl"><button id="all">▶ 上から順に ぜんぶ再生</button><button id="stop">■ とめる</button><span class="small" id="st"></span></div>
<div class="small">読みがおかしい文は「おかしい」を押してください。この端末に記録されます。さいごに「おかしい文の一覧」をコピーして送ってください。</div>
</header>
<main><div id="list"></div><h3>おかしい文の一覧</h3><textarea id="out" readonly></textarea><button id="copy">コピー</button></main>
<script>
const K="kf-voice-check-v1"; let NG={}; try{ NG=JSON.parse(localStorage.getItem(K)||"{}"); }catch(e){}
const save=()=>{ try{ localStorage.setItem(K,JSON.stringify(NG)); }catch(e){} };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kata=s=>s; const hira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const ruby=s=>esc(s).replace(/\{([^|}]+)\|([^|}]+)(?:\|[a-z]*)?\}/g,(m,a,b)=>`<ruby>${a}<rt>${hira(b)}</rt></ruby>`);
let G=null, rows=[], au=null, run=false, idx=-1;
const tabs=document.getElementById("tabs");
for(let g=1;g<=6;g++){ const b=document.createElement("button"); b.textContent=g+"年生"; b.onclick=()=>load(g); tabs.appendChild(b); }
function load(g){ stop(); [...tabs.children].forEach((b,i)=>b.classList.toggle("on",i===g-1));
  const s=document.createElement("script"); window.LEARN_DATA=null; s.src=`learn-${g}.js?v=${Date.now()}`; s.onload=()=>{ G=g; render(window.LEARN_DATA); }; document.body.appendChild(s); }
function render(D){ rows=[]; const seen=new Set();
  D.list.forEach(r=>{ const k=r[0], I=D.info[k]; (I.rei||[]).forEach((x,i)=>{ const f=(I.rv||[])[i]; if(!f||seen.has(f)) return; seen.add(f); rows.push({k,x,f}); }); });
  document.getElementById("list").innerHTML=rows.map((r,i)=>`<div class="row${NG[r.f]?" ng":""}" id="r${i}"><span class="k">${esc(r.k)}</span><span><span class="s">${ruby(r.x)}</span><br><span class="n">${i+1} / ${rows.length}　${r.f}</span></span><span class="b"><button data-p="${i}">▶</button><button class="mark" data-m="${i}">おかしい</button></span></div>`).join("");
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ run=false; play(+b.dataset.p); });
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ const r=rows[+b.dataset.m]; if(NG[r.f]) delete NG[r.f]; else NG[r.f]={g:G,k:r.k,x:r.x}; save(); b.closest(".row").classList.toggle("ng",!!NG[r.f]); out(); });
  document.getElementById("st").textContent=`${rows.length}文`; out(); }
function play(i){ if(au){ au.pause(); } document.querySelectorAll(".row.now").forEach(e=>e.classList.remove("now")); idx=i; if(i>=rows.length){ run=false; return; }
  const el=document.getElementById("r"+i); el.classList.add("now"); el.scrollIntoView({block:"center",behavior:"smooth"});
  au=new Audio("voice/"+rows[i].f); au.onended=()=>{ if(run) setTimeout(()=>play(i+1),500); }; au.onerror=()=>{ if(run) play(i+1); }; au.play().catch(()=>{}); }
function stop(){ run=false; if(au) au.pause(); }
document.getElementById("all").onclick=()=>{ run=true; play(idx>=0&&idx<rows.length?idx:0); };
document.getElementById("stop").onclick=stop;
function out(){ document.getElementById("out").value=Object.values(NG).map(v=>`${v.g}年 ${v.k}：${v.x.replace(/\{([^|}]+)\|([^|}]+)(?:\|[a-z]*)?\}/g,"$1（$2）")}`).join("\n"); }
document.getElementById("copy").onclick=()=>{ const t=document.getElementById("out"); t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){ document.execCommand("copy"); } };
load(1);
</script></body></html>
