# iPhone アプリを GitHub の Mac でビルドして App Store Connect（TestFlight）に送る。
# Actions タブ → "iOS build and upload" → Run workflow で動かす。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   APPLE_TEAM_ID       … Apple Developer のチーム ID（10文字）
#   ASC_KEY_ID          … App Store Connect API キーの キーID
#   ASC_ISSUER_ID       … App Store Connect API の 発行者ID
#   ASC_KEY_P8          … ダウンロードした AuthKey_XXXX.p8 の中身（テキスト全部）
name: iOS build and upload
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X" && xcodebuild -version
      - name: Prepare web files
        working-directory: native
        run: |
          npm ci
          python3 prepare_www.py
          npx cap sync ios
      - name: API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      # アーカイブは署名なしで作り、つぎの書き出しで配布用に自動署名する（端末の登録がいらない）
      - name: Archive
        working-directory: native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive
      - name: Upload to App Store Connect
        run: |
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}
