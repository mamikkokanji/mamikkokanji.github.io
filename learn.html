<style>

:root[data-theme="dark"]{--s6:#CFCBD6;--s12:#7F9AE0;--s5:#C99772;--on:#7FB0F0;--on-soft:#1E3550;--kun:#F2A060;--kun-soft:#43301C}

.tag.on{background:var(--on-soft);color:var(--on)}.tag.kun{background:var(--kun-soft);color:var(--kun)}.tag.sp{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.okuri{color:var(--muted);font-weight:700}
.wlist{display:flex;flex-direction:column;gap:8px}

.wrow .wt{grid-column:1/-1;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.vb{margin-left:auto;font:inherit;font-size:1.1rem;line-height:1;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.rei-box{display:flex;flex-direction:column;gap:6px}
.rei-item.rt-hide ruby rt{visibility:hidden}
.rei-item{border-radius:12px;padding:6px 8px;background:var(--card2,rgba(0,0,0,.03))}
.rei-item.rdone{box-shadow:inset 0 0 0 2px var(--ok)}
.rei-tag{font-size:.85rem;margin:2px 0 4px}
.rei-item.rt-hide .rei-tag,.rei-item.rt-hide .imi{visibility:hidden}
.imi{margin:6px 0 0;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--surface));font-size:.95rem}
.rei-tools .btn.imi-b{border-style:dashed}
.rsw .rc{background-image:linear-gradient(transparent 58%,rgba(255,205,60,.75) 58%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size 0s linear}
.rsw.go .rc{background-size:100% 100%}
@keyframes rsw{to{background-size:100% 100%}}
.rei-now{display:none;font-weight:900;color:var(--c);font-size:.9rem;margin-bottom:2px;animation:pzb 1s ease-in-out infinite alternate}
@keyframes pzb{to{transform:translateX(4px)}}
.rei-item.now{box-shadow:inset 0 0 0 3px var(--c);background:var(--surface)}
.rei-item.now .rei-now{display:block}
.rei-item.now .rei{font-weight:700}
.rei-item.later{opacity:.4}
.rei-item.rdone .rei-tools .btn:not(.done):not(.imi-b){display:none}
.rei-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rei-tools .btn{padding:4px 12px;font-size:.82rem}
.rei-tools .btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.blank{display:inline-block;width:1.4em;height:1.4em;border:2px dashed var(--c);border-radius:6px;vertical-align:-.25em;margin:0 2px}
.sentence{font-size:1.25rem;line-height:2.3;text-align:center;margin:0}
.pips{display:flex;gap:6px;justify-content:center}
.pips i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--c)}
.gift-meter{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:8px 12px;font-weight:700;font-size:.9rem}
.gift-meter .pips{justify-content:flex-start}
.gift-meter .pips i.on{background:var(--gold)}
.pirate{--c:#1C6EA4;--soft:#DCEBF6} .dragon{--c:#16855A;--soft:#DBF0E5} .hamster{--c:#17879A;--soft:#DCF1F4} .unicorn{--c:#8A5CC2;--soft:#EEE4F8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pirate{--c:#5AA9E0;--soft:#1E3550}:root:not([data-theme="light"]) .dragon{--c:#3CC487;--soft:#183A2C}:root:not([data-theme="light"]) .hamster{--c:#4CC3D4;--soft:#163A40}:root:not([data-theme="light"]) .unicorn{--c:#B48BE8;--soft:#352A4A}}
:root[data-theme="dark"] .pirate{--c:#5AA9E0;--soft:#1E3550}:root[data-theme="dark"] .dragon{--c:#3CC487;--soft:#183A2C}:root[data-theme="dark"] .hamster{--c:#4CC3D4;--soft:#163A40}:root[data-theme="dark"] .unicorn{--c:#B48BE8;--soft:#352A4A}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;margin:0;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:max(12px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted);text-decoration:none;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px}
.pill.on{color:#fff;background:var(--c);border-color:var(--c)}
.spacer{flex:1}

.hero{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;background:var(--soft);border:3px solid var(--c);border-radius:22px;padding:10px 14px}
.hero img{width:92px;height:auto}
.hero h1{margin:0;font-size:1.15rem;font-weight:900;color:var(--c);line-height:1.3}
.hero p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.bar{height:12px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:6px;border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .6s}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes a,.modes button{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:900;font-size:1rem;border-radius:16px;padding:12px 8px;border:3px solid var(--c);background:var(--surface);color:var(--c)}
.modes .on{background:var(--c);color:#fff}
/* 字のいちらん */
.chap{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px}
.chap h2{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.chap h2 .sp{margin-left:auto;font-size:1.3rem;filter:grayscale(1) opacity(.35)}
.chap h2 .sp.got{filter:none}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-k);font-size:clamp(1.5rem,8vw,2.1rem);line-height:1;padding:0}
.tile .st{font-family:var(--f-ui);font-size:.55rem;letter-spacing:-.05em;margin-top:4px;color:var(--line)}
.tile .st b{color:var(--gold);font-weight:900}
.tile.done{background:var(--soft);border-color:var(--c)}
.tile.next{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,148,14,.25);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(201,148,14,.12)}}
.legend{font-size:.75rem;color:var(--muted);text-align:center;margin:0}
/* レッスン */
.lesson{display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:6px;justify-content:center}
.steps span{flex:1;max-width:60px;line-height:1.25;text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);border-bottom:5px solid var(--line);padding-bottom:2px}
.steps span.on{color:var(--c);border-color:var(--c)}
.steps span.dn{border-color:var(--c);opacity:.5}
.talk{display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:end}
.talk img{width:60px}
.talk p{margin:0;background:var(--surface);border:2px solid var(--c);border-radius:16px 16px 16px 4px;padding:8px 12px;font-weight:700;font-size:.95rem}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:.9rem;color:var(--c)}
.big{display:flex;justify-content:center}
.kv{width:max(200px,min(74vw,280px,calc(100svh - 420px)));height:auto;aspect-ratio:1;background:var(--surface);border:3px solid var(--c);border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:3px solid var(--c);background:var(--surface);color:var(--c);font-weight:900;border-radius:99px;padding:8px 18px;font-size:.95rem}
.btn.pri{background:var(--c);color:#fff}
.btn[disabled]{opacity:.35;cursor:default}
.look-top{display:flex;gap:12px;align-items:center;justify-content:center}
.look .kv{width:min(48vw,190px)}
.look-side{display:flex;flex-direction:column;gap:8px;align-items:center;flex:1;min-width:0}
.look-side .legend{margin:0;font-size:.78rem;text-align:center}
.btn.sm{padding:6px 12px;font-size:.9rem}
#next.pulse:not(:disabled){animation:npulse 1.2s ease-in-out infinite}

.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;font-size:1rem}
.facts dt{font-size:.8rem;font-weight:700;color:var(--muted)}
.facts dd{margin:0;font-weight:700}
.on-y{font-weight:700}
.badge{display:inline-block;font-size:.75rem;font-weight:900;color:#fff;background:var(--c);border-radius:99px;padding:2px 10px}
.nari{font-size:1.05rem;line-height:1.9;margin:0}
.nari-k{font-family:var(--f-k);font-size:4.5rem;line-height:1;text-align:center;color:var(--c)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.word{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:center;font-size:1.25rem;font-weight:700}
.word mark,.rei mark{background:none;color:var(--c);font-weight:900}
.rei{font-size:1.2rem;line-height:2.2;margin:0;padding:4px 10px;border-left:5px solid var(--c);background:var(--bg);border-radius:6px}
ruby rt{font-size:.5em;color:var(--muted);font-weight:700}
.msg{min-height:1.6em;text-align:center;font-weight:900;font-size:1.05rem;margin:0}
.msg.ok{color:var(--ok)} .msg.ng{color:var(--ng)}
.count{text-align:center;font-weight:700;color:var(--muted);font-size:.9rem;margin:0}
.q{font-weight:900;font-size:1.05rem;margin:0}
.choices{display:grid;grid-template-columns:1fr;gap:8px}
.choices button{border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;font-size:1.15rem;font-weight:700}
.choices button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.choices button.ng{border-color:var(--ng);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nav{display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:0;z-index:5;background:var(--bg);margin:0 -16px;padding:10px 16px max(10px,env(safe-area-inset-bottom,0px));box-shadow:0 -8px 14px -10px rgba(0,0,0,.25)}

.ov{position:fixed;inset:0;background:rgba(30,20,40,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.prize{background:var(--surface);border-radius:26px;padding:22px 18px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;border:4px solid var(--gold)}
.prize h2{margin:0;font-size:1.3rem}
.box{font-size:5.5rem;line-height:1;background:none;border:0;padding:0;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}}
.got .stamp{display:block;margin:0 auto;transform:rotate(-8deg)}
.got{font-size:5.5rem;line-height:1;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.got-name{font-weight:900;font-size:1.2rem;color:var(--c)}
.sp-tag{font-size:.8rem;font-weight:900;color:#fff;background:var(--gold);border-radius:99px;padding:2px 12px}
.kira{position:fixed;pointer-events:none;font-size:1.4rem;animation:fall 1.4s ease-out forwards;z-index:60}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
/* たからばこ */
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:2.2rem;line-height:1;position:relative;padding:4px}
.it small{font-size:.55rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.it.no{font-size:1.6rem;color:var(--line)}
.it.sp{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--bg))}
.it .n{position:absolute;right:5px;top:3px;font-size:.65rem;font-weight:900;color:var(--c)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wy{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 0 6px}.wy-l{font-size:.85rem;color:var(--muted);font-weight:700}.wy .yomi-box{margin:0}
</style>

      ov.innerHTML=`<div class="prize">${g.sp?`<span class="sp-tag">「${placeName(chapOf(k))}」の かんじを ぜんぶ おぼえた！</span>`:`<span class="sp-tag">${PER_ITEM}字 れんしゅう できた！</span>`}<h2>「${k}」 れんしゅう かんりょう！</h2><button class="box" id="open" aria-label="あける">${g.sp?"🎁":CHAR.boxE}</button><p style="margin:0;font-weight:700">タップして あけてね</p></div>`;
      $("#open").onclick=()=>{
        kira(); const more=gi<gifts.length-1;
        ov.innerHTML=`<div class="prize">${g.sp?`<span class="sp-tag">とくべつアイテム</span>`:""}<div class="got">${g.e}</div><div class="got-name">${g.n}</div><p style="margin:0">を てに いれた！ ${CHAR.box}に いれたよ。</p>
        <div class="row">${more?`<button class="btn pri" id="more">もう 1つ あるよ！ 🎁</button>`:nav()}</div></div>`;
        if(more) $("#more").onclick=()=>{ gi++; showBox(); }; else bind();
      };
    }
    showBox();
  }
  show();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function makeQuiz(I){
  const k=I.k, qs=[], others=KS.filter(x=>x!==k);
  // 1) ことばの 中の よみ：おん（カタカナ）か くん（ひらがな）か
  const ws=I.w.filter(w=>w[5]);
  if(ws.length){
    const w=pick(ws), ans=w[5]==="on"?kata(w[3]):w[3];
    const pool=[...new Set([...I.on,...I.kun.map(([a])=>a)])].filter(x=>x!==ans&&hira(x)!==hira(ans));
    while(pool.length<2){ const o=INFO[pick(others)]; const x=pick([...o.on,...o.kun.map(([a])=>a)]); if(x&&x!==ans&&hira(x)!==hira(ans)&&!pool.some(y=>hira(y)===hira(x))) pool.push(x); }
    qs.push({q:`「<span style="font-size:1.3rem">${esc(w[0])}</span>」の「${k}」の よみかたは どれ？`,a:ans,c:shuffle([ans,...shuffle(pool).slice(0,2)]).map(x=>({v:x,h:`<span class="${/[ァ-ヶ]/.test(x)?"y-on":"y-kun"}">${esc(x)}</span>`})),after:`「${esc(w[0])}」の「${k}」は ${TAG[w[5]]}`});
  }
  // 2) ことばの いみ
  { const w=pick(I.w), ans=w[6]; const pool=shuffle(others.slice()).map(x=>pick(INFO[x].w)[6]).filter(m=>m!==ans);
    qs.push({q:`「<span style="font-size:1.3rem">${wordRuby(w,k)}</span>」の いみは？`,a:ans,c:shuffle([ans,pool[0],pool[1]])}); }
  // 3) れいぶんの □ に はいる かんじ
  { const r=pick(I.rei), sec=SECS[chapOf(k)].filter(x=>x!==k); const pool=shuffle(sec.length>=2?sec:others.slice()).slice(0,2);
    qs.push({q:`<span class="sentence" style="display:block">${sentenceBlank(r,k)}</span>□に はいる かんじは？`,a:k,c:shuffle([k,...pool]).map(x=>({v:x,h:`<span style="font-family:var(--f-k);font-size:1.6rem">${x}</span>`}))}); }
  // 4) れいぶんの よみは おんよみ？ くんよみ？
  { const cand=I.rei.filter(r=>reiType(r,k).t&&r.split("{"+k+"|").length===2&&!new RegExp("\\{[^|}]*"+k+"[^|}]*\\|").test(r.replace("{"+k+"|",""))); if(cand.length){ const r=pick(cand), t=reiType(r,k);
    qs.push({q:`<span class="sentence" style="display:block">${ruby(r.replace(/\{([^|}]+)\|([^|}]+)(?:\|[a-z]*)?\}/g,(m,a,b)=>`{${a}|${a===k?hira(b)+"・"+kata(b):hira(b)}}`),k)}</span>この ぶんの「${k}」（${esc(hira(t.y))}・${esc(kata(t.y))}）は おんよみ？ くんよみ？`,a:t.t,c:[{v:"on",h:`<span class="y-on">おんよみ</span>`},{v:"kun",h:`<span class="y-kun">くんよみ</span>`}]}); } }
  return qs;
}
