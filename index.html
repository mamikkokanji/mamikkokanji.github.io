<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta property="og:site_name" content="漢字なかまたち">
<meta property="og:title" content="漢字なかまたち">
<meta property="og:description" content="パイレーツ・ドラゴン・ハムスター・ユニコーンといっしょに、漢字検定10級・9級・5級の漢字を楽しくおぼえるゲーム">
<meta property="og:url" content="https://mamiariumi-oss.github.io/-app/">
<meta property="og:image" content="https://mamiariumi-oss.github.io/-app/og-image.png?v=2">

<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: タイトル → 「つづきから」→ キャラ4人のカード（2列）→ 級えらび */
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --ink:#2A2430; --muted:#6F6577; --line:#E8DFD3; --gold:#C9940E;
  --pirate:#1C6EA4; --pirate-soft:#DCEBF6; --dragon:#16855A; --dragon-soft:#DBF0E5;
  --hamster:#D9701A; --hamster-soft:#FCE9D6; --unicorn:#8A5CC2; --unicorn-soft:#EEE4F8;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17141B; --surface:#221E28; --ink:#F0EBF4; --muted:#A99FB2; --line:#3A3341; --gold:#E8B63E;
  --pirate:#5AA9E0; --pirate-soft:#1E3550; --dragon:#3CC487; --dragon-soft:#183A2C;
  --hamster:#F2903C; --hamster-soft:#43301C; --unicorn:#B48BE8; --unicorn-soft:#352A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141B; --surface:#221E28; --ink:#F0EBF4; --muted:#A99FB2; --line:#3A3341; --gold:#E8B63E;
  --pirate:#5AA9E0; --pirate-soft:#1E3550; --dragon:#3CC487; --dragon-soft:#183A2C;
  --hamster:#F2903C; --hamster-soft:#43301C; --unicorn:#B48BE8; --unicorn-soft:#352A4A; color-scheme:dark}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:1.7rem;font-weight:900;margin:0;letter-spacing:.06em;text-align:center}
.lead{margin:-8px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
.cont{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:3px solid var(--gold);border-radius:20px;padding:10px 16px}
.cont img{width:64px;height:64px}
.cont b{display:block;font-size:1.1rem}
.cont span{font-size:.85rem;color:var(--muted)}
.cont i{margin-left:auto;font-style:normal;font-weight:900;color:var(--gold);font-size:1.4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chara{font:inherit;color:var(--ink);background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.chara img{width:min(100%,130px);aspect-ratio:1;height:auto;border-radius:16px;background:var(--soft)}
.chara b{font-size:1.05rem;font-weight:900;color:var(--c)}
.chara small{font-size:.75rem;color:var(--muted)}
.chara[aria-expanded="true"]{border-color:var(--c);background:var(--soft)}
.chara:focus-visible,.kyu:focus-visible,.cont:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{background:var(--surface);border:3px solid var(--c);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:1.1rem;color:var(--c)}
.kyu{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:14px;padding:12px 14px}
.kyu .k{font-size:1.4rem;font-weight:900;color:var(--c);min-width:3.2em}
.kyu .d{font-size:.8rem;color:var(--muted);line-height:1.4}
.kyu .d b{color:var(--ink);font-size:.9rem}
.kyu i{font-style:normal;font-weight:900;color:var(--c);font-size:1.3rem}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin:0}
.pirate{--c:var(--pirate);--soft:var(--pirate-soft)} .dragon{--c:var(--dragon);--soft:var(--dragon-soft)}
.hamster{--c:var(--hamster);--soft:var(--hamster-soft)} .unicorn{--c:var(--unicorn);--soft:var(--unicorn-soft)}
</style>
</head>
<body>
<div class="wrap">
  <h1>漢字なかまたち</h1>
  <p class="lead">なかまをえらんで、漢字の冒険にでかけよう！</p>
  <a class="cont" id="cont" hidden></a>
  <div class="grid" id="grid"></div>
  <section class="panel" id="panel" hidden aria-live="polite"></section>
  <p class="note">記録はこのスマホ（ブラウザ）に保存されます。キャラや級ごとに、べつべつに進みます。</p>
</div>
<script>
const CHARS = [
  {id:"pirate",  name:"漢字パイレーツ",  who:"海賊の男の子",   kyus:["10","9","5"], key:k=>`kanji-pirate-${k}kyu-v1`},
  {id:"dragon",  name:"漢字ドラゴン",    who:"ドラゴン",       kyus:["9","5"],      key:k=>k==="5"?"kanji-dragon-v1":`kanji-dragon-${k}kyu-v1`},
  {id:"hamster", name:"漢字ハムスター",  who:"ハムスター",     kyus:["10","9","5"], key:k=>`kanji-hamster-${k}kyu-v2`},
  {id:"unicorn", name:"漢字ユニコーン",  who:"ユニコーン",     kyus:["10","9","5"], key:k=>`kanji-unicorn-${k}kyu-v1`},
];
const KYU_TXT = {"10":"1年生の80字","9":"2年生の160字","5":"6年生の191字"};
const $ = id=>document.getElementById(id);
function read(key){ try{ const v=JSON.parse(localStorage.getItem(key)||"null"); return v&&typeof v.correct==="number"?v:null; }catch(e){ return null; } }
function last(){ try{ return localStorage.getItem("kanji-app-last"); }catch(e){ return null; } }
function info(c,k){
  const v=read(c.key(k));
  return v&&v.answered ? `正解 <b>${v.correct}</b> 問（${v.answered}問とき）` : "はじめから";
}
function render(open){
  $("grid").innerHTML = CHARS.map(c=>`<button type="button" class="chara ${c.id}" data-id="${c.id}" aria-expanded="${open===c.id}">
      <img src="chara-${c.id}.png" alt="" width="130" height="130"><b>${c.name}</b><small>${c.kyus.map(k=>k+"級").join("・")}</small></button>`).join("");
  $("grid").querySelectorAll(".chara").forEach(b=>b.addEventListener("click",()=>{ const id=b.dataset.id; render(open===id?null:id); if(open!==id) $("panel").scrollIntoView({behavior:"smooth",block:"nearest"}); }));
  const c=CHARS.find(x=>x.id===open);
  $("panel").hidden=!c;
  if(c){
    $("panel").className="panel "+c.id;
    $("panel").innerHTML=`<h2>${c.name}：級をえらぶ</h2>`+c.kyus.map(k=>`<a class="kyu" href="${c.id}-${k}.html"><span class="k">${k}級</span><span class="d">${KYU_TXT[k]}<br>${info(c,k)}</span><i>›</i></a>`).join("");
  }
}
const L=last(), m=L&&L.match(/^(pirate|dragon|hamster|unicorn)-(10|9|5)$/), lc=m&&CHARS.find(c=>c.id===m[1]&&c.kyus.includes(m[2]));
if(lc){
  $("cont").hidden=false; $("cont").href=L+".html"; $("cont").className="cont "+lc.id;
  $("cont").innerHTML=`<img src="chara-${lc.id}.png" alt="" width="64" height="64"><div><b>つづきから：${lc.name} ${m[2]}級</b><span>${info(lc,m[2]).replace(/<\/?b>/g,"")}</span></div><i>›</i>`;
}
render(null);
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
</html>
