<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>かんじフレンズ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8A5CC2">
<meta name="description" content="パイレーツ・ドラゴン・ペンギン・ユニコーンといっしょに、小学校で習う漢字を楽しくおぼえるゲーム">
<meta property="og:type" content="website">
<meta property="og:site_name" content="かんじフレンズ">
<meta property="og:title" content="かんじフレンズ">
<meta property="og:description" content="パイレーツ・ドラゴン・ペンギン・ユニコーンといっしょに、小学1〜6年生の漢字を楽しくおぼえるゲーム">
<meta property="og:url" content="https://mamiariumi-oss.github.io/-app/">
<meta property="og:image" content="https://mamiariumi-oss.github.io/-app/og-image-v4.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=5" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かんじフレンズ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: タイトル → 「つづきから」→ キャラ4人のカード（2列）→ 級えらび */
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --ink:#2A2430; --muted:#6F6577; --line:#E8DFD3; --gold:#C9940E;
  --pirate:#1C6EA4; --pirate-soft:#DCEBF6; --dragon:#16855A; --dragon-soft:#DBF0E5;
  --hamster:#17879A; --hamster-soft:#DCF1F4; --unicorn:#8A5CC2; --unicorn-soft:#EEE4F8;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17141B; --surface:#221E28; --ink:#F0EBF4; --muted:#A99FB2; --line:#3A3341; --gold:#E8B63E;
  --pirate:#5AA9E0; --pirate-soft:#1E3550; --dragon:#3CC487; --dragon-soft:#183A2C;
  --hamster:#4CC3D4; --hamster-soft:#163A40; --unicorn:#B48BE8; --unicorn-soft:#352A4A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17141B; --surface:#221E28; --ink:#F0EBF4; --muted:#A99FB2; --line:#3A3341; --gold:#E8B63E;
  --pirate:#5AA9E0; --pirate-soft:#1E3550; --dragon:#3CC487; --dragon-soft:#183A2C;
  --hamster:#4CC3D4; --hamster-soft:#163A40; --unicorn:#B48BE8; --unicorn-soft:#352A4A; color-scheme:dark}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:max(20px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:1.7rem;font-weight:900;margin:0;letter-spacing:.06em;text-align:center}
.lead{margin:-8px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
.cont{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:3px solid var(--gold);border-radius:20px;padding:10px 16px}
.cont img{width:64px;height:64px}
.cont b{display:block;font-size:1.1rem}
.cont span{font-size:.85rem;color:var(--muted)}
.cont i{margin-left:auto;font-style:normal;font-weight:900;color:var(--gold);font-size:1.4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chara{font:inherit;color:var(--ink);background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.chara img{width:min(100%,130px);aspect-ratio:1;height:auto;border-radius:16px;background:var(--soft)}
.chara b{font-size:1.05rem;font-weight:900;color:var(--c)}
.chara small{font-size:.75rem;color:var(--muted)}
.chara[aria-expanded="true"]{border-color:var(--c);background:var(--soft)}
.chara:focus-visible,.kyu:focus-visible,.cont:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.panel{grid-column:1/-1;background:var(--surface);border:3px solid var(--c);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:1.1rem;color:var(--c)}
.kyu{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:14px;padding:12px 14px}
.kyu .k{font-size:1.4rem;font-weight:900;color:var(--c);min-width:3.2em}
.kyu .d{font-size:.8rem;color:var(--muted);line-height:1.4}
.kyu .d b{color:var(--ink);font-size:.9rem}
.kyu i{font-style:normal;font-weight:900;color:var(--c);font-size:1.3rem}
.gr{background:var(--soft);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.gr h3{margin:0;font-size:1.15rem;font-weight:900;color:var(--c);display:flex;align-items:baseline;gap:8px}
.gr h3 small{font-size:.78rem;color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.md{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:3px solid var(--c);border-radius:14px;padding:8px 10px}
.md b{font-size:1.05rem;color:var(--c)}
.md span{font-size:.72rem;color:var(--muted);line-height:1.35}
.md .pb{height:7px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:3px}
.md .pb i{display:block;height:100%;background:var(--c)}
.md:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:.78rem;color:var(--muted);text-align:center;margin:0}
.pirate{--c:var(--pirate);--soft:var(--pirate-soft)} .dragon{--c:var(--dragon);--soft:var(--dragon-soft)}
.hamster{--c:var(--hamster);--soft:var(--hamster-soft)} .unicorn{--c:var(--unicorn);--soft:var(--unicorn-soft)}

/* かんじフレンズ トップ（MAさんのデザイン画像に合わせる） */
body{background:linear-gradient(180deg,#FFF9F0,#FBF1E3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:var(--bg)}}
:root[data-theme="dark"] body{background:var(--bg)}
h1{font-size:2.05rem;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.04em}
h1 .spk{color:#F2C230;font-size:1.3rem}
.lead{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:clamp(.72rem,3.4vw,.92rem);white-space:nowrap;margin-top:-10px}
.lead .ray{color:#F2C230;font-weight:900}
.cont{border-width:3px;border-radius:22px;padding:10px 14px;background:var(--surface)}
.cont img{width:84px;height:68px;object-fit:cover;border-radius:12px}
.grid{gap:14px}
.chara{border:3px solid #F1E2CE;border-radius:26px;padding:12px 8px 12px;gap:4px;box-shadow:0 4px 0 rgba(160,120,70,.06)}
.chara img{width:100%;max-width:200px;aspect-ratio:auto;height:auto;border-radius:0;background:none}
.chara b{font-size:clamp(.95rem,4.6vw,1.2rem);letter-spacing:0;white-space:nowrap}
.chara small{font-size:.88rem}
@media (max-width:380px){h1{font-size:1.7rem}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chara{border-color:var(--line)}}
:root[data-theme="dark"] .chara{border-color:var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="spk" aria-hidden="true">✦</span>かんじフレンズ<span class="spk" aria-hidden="true">✦</span></h1>
  <p class="lead"><span class="ray" aria-hidden="true">＼</span>なかまを えらんで、かんじの ぼうけんに でかけよう！<span class="ray" aria-hidden="true">／</span></p>
  <a class="cont" id="cont" hidden></a>
  <div class="grid" id="grid"></div>
  <section class="panel" id="panel" hidden aria-live="polite"></section>
  <p class="note">記録はこのスマホ（ブラウザ）に保存されます。キャラや学年ごとに、べつべつに進みます。</p>
</div>
<script>
const CHARS = [
  {id:"pirate",  name:"漢字パイレーツ",  who:"海賊の男の子",   kyus:["10","9","8","7","6","5"], key:k=>`kanji-pirate-${k}kyu-v1`},
  {id:"unicorn", name:"漢字ユニコーン",  who:"ユニコーン",     kyus:["10","9","8","7","6","5"], key:k=>`kanji-unicorn-${k}kyu-v1`},
  {id:"hamster", name:"漢字ペンギン",  who:"ペンギン",     kyus:["10","9","8","7","6","5"], key:k=>`kanji-hamster-${k}kyu-v2`},
  {id:"dragon",  name:"漢字ドラゴン",    who:"ドラゴン",       kyus:["10","9","8","7","6","5"], key:k=>k==="5"?"kanji-dragon-v1":`kanji-dragon-${k}kyu-v1`},
];
const KYU_TXT = {"10":"漢字 80字","9":"漢字 160字","8":"漢字 200字","7":"漢字 202字","6":"漢字 193字","5":"漢字 191字"};
const GR = {"10":"1","9":"2","8":"3","7":"4","6":"5","5":"6"};
const $ = id=>document.getElementById(id);
function read(key){ try{ const v=JSON.parse(localStorage.getItem(key)||"null"); return v&&typeof v.correct==="number"?v:null; }catch(e){ return null; } }
const SECN={"10":8,"9":10,"8":10,"7":10,"6":10,"5":10}, LG=GR, NK={"10":80,"9":160,"8":200,"7":202,"6":193,"5":191};
function learnInfo(c,k){ try{ const v=JSON.parse(localStorage.getItem("kanji-learn-v1")||"{}"); const L=(v.learned||{})[c.id+"-"+LG[k]]||{}; return Object.keys(L).length; }catch(e){ return 0; } }
function quizInfo(c,k){ const v=read(c.key(k)); return v?(+v.cleared||0):0; }
function last(){ try{ return localStorage.getItem("kanji-app-last"); }catch(e){ return null; } }
function info(c,k){
  const v=read(c.key(k));
  return v&&v.answered ? `正解 <b>${v.correct}</b> 問（${v.answered}問とき）` : "はじめから";
}
function render(open){
  $("grid").after($("panel"));
  $("grid").innerHTML = CHARS.map(c=>`<button type="button" class="chara ${c.id}" data-id="${c.id}" aria-expanded="${open===c.id}">
      <img src="chara-${c.id}.png?v=5" alt="" width="366" height="322"><b>${c.name}</b><small>${GR[c.kyus[0]]}〜${GR[c.kyus[c.kyus.length-1]]}年生</small></button>`).join("");
  $("grid").querySelectorAll(".chara").forEach(b=>b.addEventListener("click",()=>{ const id=b.dataset.id; render(open===id?null:id); if(open!==id) $("panel").scrollIntoView({behavior:"smooth",block:"nearest"}); }));
  const c=CHARS.find(x=>x.id===open);
  $("panel").hidden=!c;
  if(c){
    $("panel").className="panel "+c.id;
    const PL={pirate:"島",unicorn:"国",hamster:"ばしょ",dragon:"ばしょ"}[c.id];
    $("panel").innerHTML=`<h2>${c.name}：学年と モードを えらぶ</h2>`+c.kyus.map(k=>{ const n=learnInfo(c,k), q=quizInfo(c,k);
      return `<div class="gr"><h3>${GR[k]}年生 <small>${KYU_TXT[k]}</small></h3><div class="two">
      <a class="md" href="learn.html?c=${c.id}&g=${LG[k]}"><b>📖 おぼえる</b><span>おぼえた ${n} / ${NK[k]}字</span><span class="pb"><i style="width:${n/NK[k]*100}%"></i></span></a>
      <a class="md" href="${c.id}-${k}.html"><b>✏️ クイズ</b><span>${PL} ${q} / ${SECN[k]} クリア・${info(c,k).replace(/<\/?b>/g,"")}</span><span class="pb"><i style="width:${q/SECN[k]*100}%"></i></span></a></div></div>`; }).join("");
    // えらんだキャラの段のすぐ下に出す
    const cards=$("grid").querySelectorAll(".chara"), idx=CHARS.indexOf(c), end=cards[Math.min(idx|1,cards.length-1)];
    end.after($("panel"));
  }else{ $("grid").after($("panel"));
  }
}
const L=last(), lm=L&&L.match(/^learn:(pirate|dragon|hamster|unicorn)-([1-6])$/);
const m=L&&L.match(/^(pirate|dragon|hamster|unicorn)-(10|9|8|7|6|5)$/), lc=m&&CHARS.find(c=>c.id===m[1]&&c.kyus.includes(m[2]));
if(lm){ const c=CHARS.find(x=>x.id===lm[1]), k={"1":"10","2":"9","3":"8","4":"7","5":"6","6":"5"}[lm[2]];
  $("cont").hidden=false; $("cont").href=`learn.html?c=${c.id}&g=${lm[2]}`; $("cont").className="cont "+c.id;
  $("cont").innerHTML=`<img src="chara-${c.id}.png?v=5" alt="" width="84" height="68"><div><b>つづきから：${c.name} ${lm[2]}年生</b><span>📖 おぼえる（${learnInfo(c,k)} / ${NK[k]}字）</span></div><i>›</i>`;
}else if(lc){
  $("cont").hidden=false; $("cont").href=L+".html"; $("cont").className="cont "+lc.id;
  $("cont").innerHTML=`<img src="chara-${lc.id}.png?v=5" alt="" width="84" height="68"><div><b>つづきから：${lc.name} ${GR[m[2]]}年生</b><span>✏️ クイズ・${info(lc,m[2]).replace(/<\/?b>/g,"")}</span></div><i>›</i>`;
}
render(null);
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
</body>
</html>
