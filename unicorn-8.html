<style>
.home-btn{display:inline-flex;align-items:center;gap:2px;font:inherit;font-size:.85rem;font-weight:700;color:var(--muted);text-decoration:none;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px 4px 8px;flex-basis:100%;max-width:max-content;margin-bottom:-4px}
.mode-row{display:flex;gap:8px;flex-basis:100%;flex-wrap:wrap;margin-bottom:-4px}.mode-row .home-btn{flex-basis:auto;margin:0}.mode-btn{color:var(--accent,#C9940E)!important;border-color:currentColor!important}
.home-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap>header{order:0}.wrap>.room,.wrap>.nest{order:1}.wrap>#chapBar{order:2}.wrap>.sea.in-battle{order:3}.wrap>#quiz{order:4}.wrap>.sea{order:5}.wrap>.pg{order:6}.wrap>.settings{order:7}.wrap>.foot{order:8}
.wrap>.room,.wrap>.nest{position:sticky;top:max(6px,env(safe-area-inset-top,0px));z-index:30;grid-template-columns:104px 1fr;gap:12px;padding:8px 14px;box-shadow:0 8px 20px -8px rgba(0,0,0,.25);overflow:visible}
.wrap>.room svg,.wrap>.nest svg{width:104px;height:104px;overflow:visible}
.wrap>.room .stage-name,.wrap>.nest .stage-name{font-size:1.05rem}
.wrap>.room .stage-lv,.wrap>.nest .stage-lv{font-size:.7rem}
.wrap>.room .meter,.wrap>.nest .meter{margin-top:4px;height:12px}
.wrap>.room .meter-txt,.wrap>.nest .meter-txt{font-size:.8rem;margin-top:2px}
.wrap>.room .road{display:none}
.wrap>.room .stats,.wrap>.nest .stats{font-size:.72rem;gap:10px;margin-top:0}
.kjump svg{animation:kjump .85s cubic-bezier(.3,.7,.4,1)}
@keyframes kjump{0%{transform:translateY(0)}12%{transform:translateY(4px) scale(1.08,.9)}42%{transform:translateY(-30px) scale(.94,1.07)}68%{transform:translateY(0) scale(1.06,.94)}82%{transform:translateY(-7px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.kjump svg{animation:none}}
#bossBtn.bosscall{animation:bosscall 1s ease-in-out 4}
@keyframes bosscall{50%{transform:scale(1.08);box-shadow:0 0 0 6px rgba(201,148,14,.35)}}
@media (prefers-reduced-motion:reduce){#bossBtn.bosscall{animation:none}}
@media (max-width:420px){.wrap>.room,.wrap>.nest{grid-template-columns:80px 1fr;gap:10px;padding:6px 12px;border-radius:16px}.wrap>.room svg,.wrap>.nest svg{width:80px;height:80px}.wrap>.room .stats span:nth-child(3),.wrap>.nest .stats span:nth-child(3){display:none}.wrap>.room .stage-name,.wrap>.nest .stage-name{font-size:.98rem}}
.wrap>.room .stats,.wrap>.nest .stats{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
</style>

<title>漢字ユニコーン 3年生</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: ユニコーンのへや（上）＋問題カード（下）の1列。スマホでもそのまま縦にならぶ */
:root{
  --bg:#F8F3FC; --surface:#FFFFFF; --ink:#2A2236; --muted:#6E6480; --line:#E4D8F0;
  --acc:#8A5CC2; --acc-soft:#EEE4F8; --ok:#2E8656; --ok-soft:#D9F0E2; --bad:#C2413A; --bad-soft:#F8DEDB; --gold:#C9940E;
  --uni:#FFFFFF; --mane:#F49AC1; --horn:#F2C14E; --hoof:#B69BE8; --wing:#EAF2FF; --snout:#FBE3EC; --pink:#F09AA4; --sea:#BFD9F6;
  --f-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-kanji:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17121F; --surface:#221B2D; --ink:#EEE8F5; --muted:#A99DBB; --line:#3A3049;
  --acc:#B48BE8; --acc-soft:#352A4A; --ok:#4CC383; --ok-soft:#1E3A2A; --bad:#F07068; --bad-soft:#3E2220; --gold:#E8B63E;
  --uni:#F4F0FA; --mane:#E98DB7; --horn:#E8B63E; --hoof:#A58ADB; --wing:#DCE6F7; --snout:#F3D6E2; --pink:#E98E99; --sea:#4A5F8F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17121F; --surface:#221B2D; --ink:#EEE8F5; --muted:#A99DBB; --line:#3A3049;
  --acc:#B48BE8; --acc-soft:#352A4A; --ok:#4CC383; --ok-soft:#1E3A2A; --bad:#F07068; --bad-soft:#3E2220; --gold:#E8B63E;
  --uni:#F4F0FA; --mane:#E98DB7; --horn:#E8B63E; --hoof:#A58ADB; --wing:#DCE6F7; --snout:#F3D6E2; --pink:#E98E99; --sea:#4A5F8F; color-scheme:dark}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:900;margin:0;letter-spacing:.04em}
.sub{color:var(--muted);font-size:.85rem}
.room{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.room svg{width:150px;height:150px;display:block}
.stage-name{font-weight:900;font-size:1.25rem;margin:0;line-height:1.3}
.stage-lv{font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.meter{height:14px;background:var(--acc-soft);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--acc));border-radius:99px;transition:width .4s}
.meter-txt{font-size:.85rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.meter-txt b{color:var(--ink)}
.stats{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.road{display:flex;gap:4px;margin-top:8px}
.road span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.road span.on{background:var(--acc)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.qtype{align-self:flex-start;font-size:.75rem;font-weight:700;letter-spacing:.08em;background:var(--acc-soft);color:var(--acc);padding:2px 10px;border-radius:99px}
.prompt{font-size:1.05rem;font-weight:700;margin:0}
.big .wyomi{display:block;font-family:var(--f-ui);font-size:1.05rem;font-weight:700;color:var(--muted);letter-spacing:.12em;line-height:1.4;margin-top:6px}
.big{font-family:var(--f-kanji);font-size:4.2rem;line-height:1.1;text-align:center;margin:4px 0;letter-spacing:.08em}
.big .blank{display:inline-block;width:1em;height:1em;border:3px dashed var(--acc);border-radius:10px;vertical-align:-.12em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 8px;min-height:64px;cursor:pointer;transition:transform .08s,border-color .15s}
.choices button.k{font-family:var(--f-kanji);font-size:2rem;font-weight:600}
@media (hover:hover) and (pointer:fine){.choices button:hover:not(:disabled){border-color:var(--acc)}}
.choices button:active:not(:disabled){transform:scale(.97)}
.choices button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.choices button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choices button.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.choices button:disabled{cursor:default}
.feedback{border-radius:14px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.feedback .res{font-weight:900;font-size:1.1rem}
.feedback .res.ok{color:var(--ok)} .feedback .res.ng{color:var(--bad)}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;margin:0}
.info .kj{font-family:var(--f-kanji);font-size:3rem;line-height:1;grid-row:span 4}
.info dt{display:none}
.info dd{margin:0;font-size:.9rem}
.info .lab{color:var(--muted);font-size:.75rem;margin-right:6px}
.btn{font:inherit;font-weight:900;font-size:1.05rem;border:0;border-radius:14px;padding:14px;background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);font-size:.85rem;padding:8px 12px;font-weight:700}
.settings{display:flex;flex-direction:column;gap:8px}
.settings h2{font-size:.85rem;margin:0;color:var(--muted);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.85rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;font-size:.85rem;flex-wrap:wrap}
.confirm .btn{font-size:.85rem;padding:8px 12px;background:var(--bad)}
/* 書き取りパッド：漢字練習帳のマス目 */
.kaki{display:flex;flex-direction:column;gap:12px}
.hint{margin:0;font-size:.9rem}
.hint .lab{color:var(--muted);font-size:.75rem;margin-right:4px}
.pads{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pad{box-sizing:border-box;container-type:inline-size;position:relative;width:min(100%,320px);aspect-ratio:1;max-width:100%;background:var(--surface);border:3px solid var(--acc);border-radius:6px;
  background-image:linear-gradient(var(--line),var(--line)),linear-gradient(var(--line),var(--line));
  background-size:100% 2px,2px 100%;background-position:center;background-repeat:no-repeat}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
/* 書くときに画面がスクロールしないように（端末によって効かない touch-action のかわりに JS でも止める） */
.pad{touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{overscroll-behavior-y:none}
.pad.answer{border-color:var(--ok);display:flex;align-items:center;justify-content:center}
.pad.answer[hidden]{display:none!important}
.pad.answer span{font-family:var(--f-kanji);font-size:72cqw;line-height:1;color:var(--ink)}
.padtools{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.padtools .btn{font-size:.9rem;padding:12px 8px}
.selfcheck{display:flex;flex-direction:column;gap:10px}
.selfcheck .choices button{font-size:1.1rem}
.pads.both .pad{width:calc(50% - 6px)}
/* 進化の画面 */
.evo{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.evo-box{background:var(--surface);border:3px solid var(--gold);border-radius:24px;padding:24px 20px;text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.evo-box svg{width:200px;height:200px;animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
.evo-box h2{margin:0;font-size:1.3rem;font-weight:900;color:var(--acc)}
.evo-new{font-size:.85rem;color:var(--muted)}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:50% 92%}
@keyframes bob{50%{transform:translateY(-3px) scaleY(1.02)}}
.munch .bob{animation:munch .7s ease-in-out}
#pirBox{border-radius:16px;background:linear-gradient(color-mix(in srgb,var(--sea) 55%,var(--surface)),var(--acc-soft) 74%,color-mix(in srgb,var(--ok) 25%,var(--surface)) 74%)}
@keyframes munch{20%{transform:scale(1.08,.92)}45%{transform:translateY(-10px) scale(.96,1.05)}70%{transform:scale(1.04,.96)}}
@media (prefers-reduced-motion:reduce){.bob,.evo-box svg,.munch .bob.meter i{transition:none}}
@media (max-width:420px){.room{grid-template-columns:110px 1fr;gap:12px}.room svg{width:110px;height:110px}.big{font-size:3.4rem}}
/* 島（セクション）とボス戦 */
.sea{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sea h2{margin:0;font-size:.85rem;color:var(--muted);letter-spacing:.06em}
.isles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.isle{font:inherit;font-size:.7rem;font-weight:700;line-height:1.25;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center}
.isle b{font-size:1rem}
.isle[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.isle.clear b{color:var(--gold)}
.isle:disabled{opacity:.45;cursor:default}
.isle:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.isle-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.isle-name{font-weight:900;font-size:1.1rem;margin:0}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tiles span{font-family:var(--f-kanji);font-size:1.15rem;width:1.9rem;height:1.9rem;display:grid;place-items:center;border-radius:8px;background:var(--bg);color:var(--muted);border:1.5px dashed var(--line)}
.tiles span.f{background:var(--acc-soft);color:var(--ink);border:1.5px solid var(--acc)}
.bossrow{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:10px}
.bossrow svg{width:84px;height:84px;display:block}
.bossrow p{margin:0;font-size:.85rem}
.bossrow .bn{font-weight:900;font-size:1rem}
.bossrow .btn{margin-top:6px;width:100%;padding:10px}
.bossrow .btn:disabled{background:var(--line);color:var(--muted);cursor:default}
.sea.in-battle{padding:0;border:0;background:none}
.battle{background:linear-gradient(var(--acc-soft),color-mix(in srgb,var(--sea) 45%,var(--surface)));border:3px solid var(--bad);border-radius:20px;padding:14px 16px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
.battle svg{width:120px;height:120px;display:block}
.battle.hit svg{animation:hit .5s}
@keyframes hit{20%{transform:translateX(-8px) rotate(-6deg)}40%{transform:translateX(8px) rotate(5deg)}60%{transform:translateX(-4px)}}
.hp{height:14px;background:var(--surface);border-radius:99px;overflow:hidden;border:2px solid var(--bad)}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s}
.hearts{font-size:1.2rem;letter-spacing:.1em;color:var(--bad)}
.hearts .off{color:var(--line)}
.battle .bn{font-weight:900;font-size:1.05rem;margin:0}
.battle .lab{font-size:.75rem;color:var(--muted)}
.battle .btn.ghost{margin-top:6px;padding:4px 10px;font-size:.75rem}
@media (max-width:420px){.battle{grid-template-columns:90px 1fr}.battle svg{width:90px;height:90px}}
@media (prefers-reduced-motion:reduce){.battle.hit svg{animation:none}}

/* チャプターの進み具合（50音順に7〜8字ずつ × 切り口べつの理解度） */
.pg{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pg-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pg-head h2{margin:0;font-size:.85rem;color:var(--muted);letter-spacing:.06em}
.pg-head b{font-size:1.1rem;color:var(--gold)}
.pg-axes{display:grid;grid-template-columns:auto 1fr 3.2em;gap:6px 10px;align-items:center;font-size:.8rem}
.pg-axes .bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.pg-axes .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.pg-axes .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.pg-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.pg-m{font:inherit;font-size:.75rem;font-weight:700;aspect-ratio:1;border-radius:8px;cursor:pointer;display:grid;place-items:center;padding:0;border:1.5px solid transparent}
.pg-m.cur{outline:3px solid var(--acc);outline-offset:1px}
.none{background:transparent;border:1.5px dashed var(--line)!important;color:var(--muted)}
.l0{background:var(--bad-soft);color:var(--bad)}
.l1{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ink)}
.l2{background:color-mix(in srgb,var(--ok) 50%,var(--surface));color:var(--ink)}
.l3{background:var(--ok);color:#fff}
.l4{background:var(--gold);color:#fff}
.pg-legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.7rem;color:var(--muted);align-items:center}
.pg-legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-3px;margin-right:3px}
.pg-btns{display:flex;gap:8px;flex-wrap:wrap}
.pg-btns .btn{flex:1;padding:10px;font-size:.95rem}
#chapBar:empty{display:none}
#chapBar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--acc-soft);color:var(--acc);border-radius:14px;padding:8px 12px;font-weight:700;font-size:.9rem;flex-wrap:wrap}
#chapBar .btn{padding:4px 10px;font-size:.8rem}
.pg-top{padding:4px 10px!important;font-size:.8rem!important}
/* チャプター表（全画面） */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:15;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-box{max-width:620px;margin:0 auto;padding:16px max(12px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:1}
.sheet-head h2{margin:0;font-size:1.2rem;font-weight:900}
.pg-table{display:flex;flex-direction:column;gap:4px}
.pg-row{box-sizing:border-box;font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:minmax(100px,1.5fr) repeat(7,minmax(0,1fr));gap:2px;align-items:stretch;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:5px;cursor:pointer;width:100%}
.pg-row.hd{background:none;border-color:transparent;cursor:default;position:sticky;top:44px;background:var(--bg);z-index:1}
.pg-row.cur{border-color:var(--acc)}
.pg-row[aria-expanded="true"]{border-color:var(--acc);border-bottom-left-radius:0;border-bottom-right-radius:0}
.pg-row:focus-visible,.pg-m:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pg-lab{display:flex;flex-direction:column;justify-content:center;line-height:1.2;min-width:0;padding-left:2px}
.pg-lab b{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-lab small{font-size:.62rem;color:var(--muted)}
.pg-kj{font-family:var(--f-kanji);font-size:.8rem;letter-spacing:0;white-space:nowrap;overflow:hidden}
.pg-c{display:grid;place-items:center;border-radius:7px;font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;min-height:38px}
.pg-c.hd{font-size:.62rem;color:var(--muted);line-height:1.15;text-align:center;min-height:0;word-break:keep-all}
.pg-detail{background:var(--surface);border:2px solid var(--acc);border-top:0;border-radius:0 0 12px 12px;margin-top:-4px;padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.pg-dt{display:grid;grid-template-columns:minmax(100px,1.5fr) repeat(7,minmax(0,1fr));gap:2px;align-items:center;text-align:center}
.pg-dt .k{font-family:var(--f-kanji);font-size:1.4rem;text-align:left;padding-left:6px;line-height:1.2}
.pg-dt .k small{font-family:var(--f-ui);font-size:.6rem;color:var(--muted);margin-left:4px}
.pg-dt .s{font-weight:900;font-size:1rem;border-radius:6px;padding:2px 0}
.pg-dt .s.ok{color:var(--ok)} .pg-dt .s.half{color:var(--gold)} .pg-dt .s.ng{color:var(--bad)} .pg-dt .s.no{color:var(--line)}
.pg-dt .hd{font-size:.6rem;color:var(--muted)}
.pg-note{font-size:.72rem;color:var(--muted);margin:0}
/* 書き順（KanjiVG） */
.kvg-s{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.kvg-hi{fill:none;stroke:var(--bad);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.kvg-g{fill:none;stroke:var(--line);stroke-width:.8;stroke-dasharray:3 3}
.big svg.kvg{width:min(56vw,200px);height:auto;display:block;margin:0 auto;border:3px solid var(--acc);border-radius:6px;background:var(--surface)}
.jun-box{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.jun-box summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:.85rem}
.jun-box .lab{color:var(--muted);font-size:.75rem}
.jun-strip{display:flex;flex-wrap:wrap;gap:4px}
.jun-strip figure{margin:0;display:flex;flex-direction:column;align-items:center;font-size:.6rem;color:var(--muted)}
.jun-strip svg{width:44px;height:44px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
@media (max-width:400px){.pg-row,.pg-dt{grid-template-columns:minmax(96px,1.6fr) repeat(7,minmax(0,1fr))}.pg-kj{font-size:.74rem}.pg-c{font-size:.66rem}.pg-c.hd{font-size:.56rem}}
.ksvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.kdraw{touch-action:none;cursor:crosshair}
.pad.kans{display:block}
.kmsg{margin:0;text-align:center;font-weight:700;color:var(--muted);min-height:1.5em}
.kmsg.ok{color:var(--ok)} .kmsg.ng{color:var(--bad)}
.padtools.kt{grid-template-columns:1fr 1fr}
.evo{z-index:90}.evo-box{max-height:calc(100dvh - 32px);overflow-y:auto}
</style>

</head>

</div>

<div class="evo" id="evo" hidden>

  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">

  </div>
</div>

const KEY = "kanji-unicorn-"+APP_KYU+"kyu-v1";
const DEFAULT = ()=>({correct:0, answered:0, streak:0, best:0, types:TYPES.map(t=>t.id), miss:{}, cur:null, savedAt:0, sec:0, found:{}, cleared:0, boss:null});
function valid(v){ return v && typeof v.correct==="number" && typeof v.answered==="number"; }
function loadLocal(){
  try{ const v=JSON.parse(localStorage.getItem(KEY)||"null"); if(valid(v)) return v; }catch(e){}

}
// 開いたときにこの端末にあった記録の保存時刻（開いた直後の自動保存で「新しい」と見まちがえないように）
const LOCAL0 = loadLocal(), BOOT_SAVED = (LOCAL0&&LOCAL0.savedAt)||0;
const state = Object.assign(DEFAULT(), LOCAL0||{});
if(!Array.isArray(state.types)||!state.types.length) state.types=TYPES.map(t=>t.id);
function fixState(){ if(!state.found||typeof state.found!=="object") state.found={}; if(typeof state.cleared!=="number") state.cleared=0; if(typeof state.sec!=="number"||state.sec<0||state.sec>Math.min(state.cleared,SEC_N-1)) state.sec=Math.min(state.cleared||0,SEC_N-1); if(state.boss&&state.boss.sec!==state.sec) state.boss=null; }
fixState();
let cloudRef=null, cloudBusy=false, cloudAgain=false;
function save(){
  state.savedAt=Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  cloudSave();
}
async function cloudSave(){
  if(!cloudRef) return;
  if(cloudBusy){ cloudAgain=true; return; }
  cloudBusy=true;
  try{ await cloudRef.set(JSON.parse(JSON.stringify(state))); setSync("ok"); }catch(e){ setSync("ng"); }
  cloudBusy=false;
  if(cloudAgain){ cloudAgain=false; cloudSave(); }
}
function setSync(k){
  const el=$("sync"); if(!el) return;
  el.textContent = k==="ok" ? "アカウントに保存ずみ（ほかの端末でもつづきから）" : k==="ng" ? "この端末にだけ保存しています" : "";
}
// アカウントの記録をつかうかどうか。からっぽの記録で、とちゅうの記録を上書きしない
function useRemote(r){
  if((r.answered||0)===0 && (state.answered||0)>0) return false;
  if((state.answered||0)===0 && (r.answered||0)>0) return true;
  return (r.savedAt||0) > BOOT_SAVED;
}
async function connectCloud(){
  try{
    if(!window.claude||!claude.use) return setSync("ng");
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return setSync("ng");
    const uid=await user.id(); if(!uid) return setSync("ng");
    const ref=db.collection("data/users/"+uid).doc("unicorn-"+APP_KYU+"kyu");
    const snap=await Promise.race([ref.get(), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    cloudRef=ref;
    const remote=snap.exists?snap.data():null;
    if(valid(remote) && useRemote(remote)){
      Object.assign(state, DEFAULT(), JSON.parse(JSON.stringify(remote)));
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
      fixState(); renderChips(); renderAll(); resumeOrNew();
      setSync("ok");
    }else{ cloudSave(); }
  }catch(e){ setSync("ng"); }
}

const rnd = n=>Math.floor(Math.random()*n);
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// まちがいの選択肢は、同じ級の漢字からえらぶ
function pickOthers(target, n, keyFn){
  const seen=new Set([keyFn(target)]); const out=[];
  for(const c of shuffle(ALL.filter(x=>x.kyu===target.kyu))){ const key=keyFn(c); if(seen.has(key)) continue; seen.add(key); out.push(c); if(out.length===n) break; }
  return out;
}
// にがての漢字は多めに出す
function pickTarget(){
  const P=pool();
  const missed=P.filter(c=>state.miss[c.k]>0);
  if(missed.length && Math.random()<0.35) return missed[rnd(missed.length)];
  // まだ正解していない漢字を多めに出す
  const fresh=P.filter(c=>!state.found[c.k]);
  if(fresh.length && Math.random()<0.6) return fresh[rnd(fresh.length)];
  return P[rnd(P.length)];
}

const wordNG=(w,c)=>(BLANK_NG[w]||"").includes(c.k);
const yomiHTML=w=>WORD_YOMI[w]?`<span class="wyomi">（${esc(WORD_YOMI[w])}）</span>`:"";
// 書き順・画数の選択肢：正解をふくむ6つの連続した数。正解の前後（±1）はかならず入れ、正解の位置はランダム（はしにも来る）
function nearNums(ans,lo,hi){
  const K=6;
  if(hi-lo+1<=K) return Array.from({length:hi-lo+1},(_,i)=>lo+i);
  const st=[];
  for(let s=Math.max(lo,ans-K+1); s<=Math.min(ans,hi-K+1); s++){
    if(ans>lo && s>ans-1) continue; if(ans<hi && s+K-1<ans+1) continue; st.push(s);
  }
  const s=st[rnd(st.length)];
  return Array.from({length:K},(_,i)=>s+i);
}
function makeQuestion(){
  const type = (()=>{ const W={yomi:25,kaki:25,blank:15,imi:10,bushu:10,jun:8,kakusu:7}, ts=state.types; let tot=0; ts.forEach(t=>tot+=(W[t]||10)); let r=Math.random()*tot; for(const t of ts){ r-=(W[t]||10); if(r<0) return t; } return ts[ts.length-1]; })();
  let t = type==="jun" ? junTarget() : pickTarget();
  if(!t){ t=pickTarget(); return Object.assign(buildQuestion("kakusu",t),{k:t.k}); }
  return Object.assign(buildQuestion(type,t),{k:t.k});
}
function buildQuestion(type,t){
  if(type==="jun") return junQ(t);
  if(type==="kaki"||type==="blank"){
    const words=t.words.filter(w=>w.includes(t.k) && w.length>1);
    const w=words[rnd(words.length)];
    if(!w) return makeQuestion();
    if(type==="kaki") return {type, t, prompt:"□に入る漢字をペンで書こう", big:blankHTML(w,t.k)+yomiHTML(w), opts:[]};
    const others=pickOthers(t,40,c=>c.k).filter(c=>!wordNG(w,c)).slice(0,3);
    const opts=shuffle([t,...others]).map(c=>({label:c.k, ok:c.k===t.k}));
    return {type, t, prompt:"□に入る漢字はどれ？", big:blankHTML(w,t.k)+yomiHTML(w), opts, kanjiOpts:true};
  }
  if(type==="imi"){
    const others=pickOthers(t,3,c=>c.imi);
    const opts=shuffle([t,...others]).map(c=>({label:c.k, ok:c.k===t.k}));
    return {type, t, prompt:`「${t.imi}」という意味の漢字はどれ？`, big:"", opts, kanjiOpts:true};
  }
  if(type==="yomi"){
    const others=pickOthers(t,3,c=>c.yomi);
    const opts=shuffle([t,...others]).map(c=>({label:c.yomi, ok:c.k===t.k}));
    return {type, t, prompt:"この漢字の読みはどれ？", big:esc(t.k), opts};
  }
  if(type==="bushu"){
    const others=pickOthers(t,3,c=>c.r+c.rn);
    const opts=shuffle([t,...others]).map(c=>({label:`${c.r}（${c.rn}）`, ok:c.r===t.r&&c.rn===t.rn}));
    return {type, t, prompt:"この漢字の部首はどれ？", big:esc(t.k), opts};
  }
  const opts=nearNums(t.s,1,Infinity).map(n=>({label:`${n}画`, ok:n===t.s}));
  return {type, t, prompt:"この漢字は全部で何画？", big:esc(t.k), opts};
}

// ---------- 画面 ----------
let current=null, locked=false;
function stageOf(n){ return Math.min(STAGES.length-1, Math.floor(n/PER)); }

function renderRoom(munch){
  const st=stageOf(state.correct);
  $("pirBox").innerHTML=unicornSVG(st);
  if(munch){ $("pirBox").classList.remove("munch"); void $("pirBox").offsetWidth; $("pirBox").classList.add("munch"); }
  $("stageLv").textContent=`LEVEL ${st+1} / ${STAGES.length}`;
  $("stageName").textContent=STAGES[st].name;
  if(st>=STAGES.length-1){
    $("meterBar").style.width="100%";
    $("meterTxt").innerHTML=`さいごまで進化した！ ほし <b>${state.correct}</b> こ`;
  }else{
    const inStage=state.correct%PER;
    $("meterBar").style.width=(inStage/PER*100)+"%";
    $("meterTxt").innerHTML=`ほし あと <b>${PER-inStage}</b> こで進化`;
  }
  $("road").innerHTML=STAGES.map((_,i)=>`<span class="${i<=st?"on":""}"></span>`).join("");
  const rate=state.answered?Math.round(state.correct/state.answered*100):0;
  $("stats").innerHTML=`<span>正解 ${state.correct}/${state.answered}（${rate}%）</span><span>連続 ${state.streak}</span><span>最高連続 ${state.best}</span>`;
  const misses=pool().filter(c=>state.miss[c.k]>0).map(c=>c.k);
  $("note").textContent = misses.length?`にがての漢字：${misses.slice(0,12).join(" ")}${misses.length>12?" …":""}`:"とちゅうでやめても、つづきから遊べます";
}

function renderQuestion(){ showQuestion(makeQuestion()); const {t,...q}=current; state.cur={q, done:false}; save(); }
// とちゅうの問題をそのまま出しなおす
function resumeOrNew(){
  const c=state.cur;
  if(c && !c.done && c.q && ALL.some(x=>x.k===c.q.k)){ const q=Object.assign({},c.q,{t:ALL.find(x=>x.k===c.q.k)}); showQuestion(q); }
  else renderQuestion();
}
function showQuestion(q){
  current=q; locked=false;

  $("quiz").innerHTML=`
    <span class="qtype">${tl}</span>
    <p class="prompt">${esc(current.prompt)}</p>

    </div>

  $("quiz").append(box);

    host.innerHTML=`<p class="kmsg">この じは かきじゅんの データが ないので、こたえを みて じぶんで ○× してね</p>`;
    $("padTools").innerHTML=`<button type="button" class="btn ok" id="sOk">○ かけた</button><button type="button" class="btn ghost" id="sNg">× まちがえた</button>`;
    showModel(); $("padTools").hidden=false; $("sOk").onclick=()=>grade(true); $("sNg").onclick=()=>grade(false); return;
  }
  let pad=null; const mk=()=>kMakePad(host,t.k,(ok,info)=>{
    if(ok){ msg("せいかい！ かきじゅんも ばっちり","ok"); setTimeout(()=>grade(true),400); }
    else { msg(info,"ng"); showModel(); setTimeout(()=>grade(false),kAnimTime(t.k)+3000); }
  },(s,c)=>msg(s,c||"ok"),()=>pad.misses); pad=mk();
  $("redoBtn").addEventListener("click",()=>{ if(pad.over()) return; const m=pad.misses; pad.stop(); pad=mk(); pad.misses=m; msg("さいしょから かこう（1かくめから）",""); });
  $("giveUp").addEventListener("click",()=>{ pad.stop(); msg("こたえと かきじゅんを みてみよう","ng"); showModel(); grade(false); });
}

// おぼえるモードの「みないで かく」と おなじ あまさ（TOL 17）。ヒントなし、1画 まちがえたら ×
function kMakePad(host,k,onEnd,onStep){ const MAXMISS=4;
  host.innerHTML=`<svg class="ksvg kdraw" viewBox="0 0 109 109">${kGrid}<g class="done" fill="none" stroke-linecap="round" stroke-linejoin="round"></g><path class="fail" fill="none" stroke="var(--bad)" stroke-dasharray="3 3" opacity=".7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ink" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  const st=kStroke(k), TOL=17, offs=[]; let cur=0, pts=null, pid=null, over=false;
  const cen=p=>{ let x=0,y=0; p.forEach(q=>{x+=q[0];y+=q[1];}); return [x/p.length,y/p.length]; };
  const shiftOf=()=>{ if(!offs.length) return [0,0]; const m=cen(offs); return [Math.max(-18,Math.min(18,m[0])),Math.max(-18,Math.min(18,m[1]))]; };

    if(s.len<16){ const d=Math.hypot(uc[0]-sc[0],uc[1]-sc[1]); return {r:ul<=Math.max(30,s.len*2.5)&&d<T*1.3?"ok":"no",d}; }
    const f=kDist(u,s.pts), rv=kDist(u.slice().reverse(),s.pts), tol=Math.max(T,Math.min(T*1.5,s.len*.22));

    const ue=[u[N][0]-u[0][0],u[N][1]-u[0][1]], se=[s.pts[24][0]-s.pts[0][0],s.pts[24][1]-s.pts[0][1]];
    const cos=(ue[0]*se[0]+ue[1]*se[1])/((Math.hypot(...ue)*Math.hypot(...se))||1), curved=Math.hypot(...se)<s.len*.5;
    if(f<tol&&lenOk&&(curved?f<rv:(cos>.3||f<rv*.7))) return {r:"ok",d:f};
    if(rv<tol&&lenOk&&rv<f*.8&&(curved||cos<-.3)) return {r:"rev",d:rv};

  }
  function judge(user){
    const s=st[cur], c0=check(user,s); let res=c0.r, other=-1;
    for(let j=cur+1;j<st.length;j++){ const cj=check(user,st[j]); if(cj.r==="ok"&&(res!=="ok"||cj.d<c0.d*.6)){ other=j; break; } }

}

let penSeen=false; // ペンを使い始めたら、手のひら（指）のタッチは無視する
function setupPad(cv){
  const strokes=[]; let cur=null, padLocked=false;
  const ctx=cv.getContext("2d");
  function size(){
    const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
    cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
    ctx.setTransform(d,0,0,d,0,0); draw();
  }
  function ink(){ return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#3A2A1E"; }
  function draw(){
    const r=cv.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height);
    ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=ink();
    for(const s of strokes){
      if(s.length>1){
        const avg=s.reduce((m,q)=>m+(q.p||0.5),0)/s.length;
        ctx.lineWidth=Math.max(3, r.width*0.024*(0.6+0.8*avg));
        ctx.beginPath(); ctx.moveTo(s[0].x*r.width,s[0].y*r.height);
        for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x*r.width,s[i].y*r.height);
        ctx.stroke();
      }
      if(s.length===1){ ctx.fillStyle=ink(); ctx.beginPath(); ctx.arc(s[0].x*r.width,s[0].y*r.height,r.width*0.015,0,7); ctx.fill(); }
    }

  function pt(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height, p:e.pressure||0.5}; }

    if(padLocked) return;
    if(e.pointerType==="pen") penSeen=true;
    if(penSeen && e.pointerType==="touch") return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cur={id:e.pointerId, pts:[pt(e)]}; strokes.push(cur.pts); draw();
  });
  cv.addEventListener("pointermove",e=>{
    if(!cur||e.pointerId!==cur.id) return; e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs) cur.pts.push(pt(ev));
    draw();

  const stopScroll=e=>{ if(!padLocked && e.cancelable) e.preventDefault(); };
  cv.addEventListener("touchstart",stopScroll,{passive:false});

    undo(){ if(!padLocked){ strokes.pop(); draw(); } },
    clear(){ if(!padLocked){ strokes.length=0; draw(); } },
    lock(){ padLocked=true; cur=null; }
  };
}

// ---------- チャプター（50音順に7〜8字ずつ）と、切り口べつの理解度 ----------
// state.st[漢字][切り口] = [正解の数, まちがいの数, いまの連続正解]
const CH_N = Math.ceil(ALL.length/8);
const CHAPS = Array.from({length:CH_N},(_,i)=>ALL.slice(Math.round(i*ALL.length/CH_N), Math.round((i+1)*ALL.length/CH_N)));
const AXES = [["yomi","読み"],["kaki","書き"],["jun","書き順"],["blank","熟語"],["imi","意味"],["bushu","部首"],["kakusu","画数"]];
const firstYomi = c => c.yomi.split("・")[0];
const chapRange = i => `${firstYomi(CHAPS[i][0])}〜${firstYomi(CHAPS[i][CHAPS[i].length-1])}`;
function progInit(){
  if(!state.st||typeof state.st!=="object") state.st={};
  if(typeof state.chap!=="number"||!CHAPS[state.chap]) state.chap=null;
  // 前からあそんでいる人：問題をぜんぶえらんでいたら「書き順」も出す
  if(!state.junOn){ const old=["kaki","blank","imi","yomi","bushu","kakusu"]; if(Array.isArray(state.types)&&old.every(x=>state.types.includes(x))&&!state.types.includes("jun")) state.types.push("jun"); state.junOn=1; }
}
function rec(k,type,ok){
  if(!AXES.some(a=>a[0]===type)) return;
  progInit();
  const r=(state.st[k]=state.st[k]||{}), v=Array.isArray(r[type])?r[type]:[0,0,0];
  if(ok){ v[0]++; v[2]++; } else { v[1]++; v[2]=0; }
  r[type]=v;
}
// 1字・1切り口の点数：まだ=null、にがて=0、もう少し=0.5、おぼえた（2回つづけて正解）=1
function score(k,type){ const v=state.st&&state.st[k]&&state.st[k][type]; if(!Array.isArray(v)) return null; return v[2]>=2?1:v[2]===1?.5:0; }
function cellPct(list,type){ let s=0,tried=0; for(const c of list){ const x=score(c.k,type); if(x!==null){ tried++; s+=x; } } return {pct:Math.round(s/list.length*100), tried}; }
function chapInfo(i){ let sum=0,tried=0; for(const a of AXES){ const r=cellPct(CHAPS[i],a[0]); sum+=r.pct; tried+=r.tried; } return {pct:Math.round(sum/AXES.length), tried}; }
const lv=(p,tried)=>!tried?"none":p>=100?"l4":p>=80?"l3":p>=40?"l2":p>0?"l1":"l0";
const LEGEND=`<div class="pg-legend"><span><i class="none"></i>まだ</span><span><i class="l0"></i>にがて</span><span><i class="l1"></i>1〜39%</span><span><i class="l2"></i>40〜79%</span><span><i class="l3"></i>80%〜</span><span><i class="l4"></i>100%</span></div>`;

function renderProg(){
  progInit();

  const infos=CHAPS.map((_,i)=>chapInfo(i));
  const stars=infos.filter(x=>x.pct>=80).length;

function kvgSVG(k,hi,upto,cls){
  const ps=KVG[k]||[], n=upto==null?ps.length:upto;
  return `<svg class="${cls||"kvg"}" viewBox="0 0 109 109" aria-hidden="true"><path d="M54.5 3V106M3 54.5H106" class="kvg-g"/>${ps.slice(0,n).map((d,i)=>`<path d="${d}" class="${i===hi?"kvg-hi":"kvg-s"}"/>`).join("")}</svg>`;
}
function junTarget(){
  for(let i=0;i<10;i++){ const c=pickTarget(); if((KVG[c.k]||[]).length>=4) return c; }
  const P=pool().filter(c=>(KVG[c.k]||[]).length>=4); return P.length?P[rnd(P.length)]:null;
}
function junQ(t){
  const n=(KVG[t.k]||[]).length, h=(rnd(n)===0&&rnd(3)===0)?0:1+rnd(n-1);
  const opts=nearNums(h+1,1,n).map(x=>({label:`${x}画目`, ok:x===h+1}));
  return {type:"jun", t, prompt:"赤いところは、何画目に書く？", big:kvgSVG(t.k,h), opts};
}
function junStrip(t,type){
  const ps=KVG[t.k]; if(!ps||!ps.length) return "";
  const body=`<div class="jun-strip">${ps.map((_,i)=>`<figure>${kvgSVG(t.k,i,i+1,"kvg-mini")}<figcaption>${i+1}</figcaption></figure>`).join("")}</div>`;

(function(){
  if(typeof makeQuestion!=="function") return;
  const kOf=q=>q&&(q.k||(q.t&&q.t.k));
  let last=null; try{ last=kOf(state.cur&&state.cur.q)||null; }catch(e){}
  const _mq=makeQuestion; let busy=false;
  makeQuestion=function(){
    if(busy) return _mq();
    busy=true; let q;
    for(let i=0;i<15;i++){
      q=_mq();
      const bad1=q.type==="kakusu"&&q.t&&q.t.s<=1;

<script>
// 答えたら：正解ならキャラがピョンととぶ。けっか（せいかい／ざんねん）が見えるところまで自動でスクロール（キャラは上に見えたまま）
(function(){
  const box=()=>document.querySelector("#pirBox,#hamBox,#dragonBox");
  const q=document.getElementById("quiz"); if(!q) return;
  const calm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function showResult(fb){
    requestAnimationFrame(()=>{
      const card=document.querySelector(".wrap>.room,.wrap>.nest");
      const top=card?(parseFloat(getComputedStyle(card).top)||0)+card.offsetHeight:0;
      const r=fb.getBoundingClientRect();
      const nb=document.getElementById("nextBtn");
      const end=(nb&&nb.offsetParent?nb:fb).getBoundingClientRect().bottom;
      const vh=(window.visualViewport&&visualViewport.height)||window.innerHeight;
      const cap=window.scrollY+r.top-top-12;
      let y=null;
      if(r.top<top+8) y=cap;
      else if(end>vh-80) y=Math.min(cap,window.scrollY+end-(vh-80));
      if(y!=null) window.scrollTo({top:Math.max(0,y),behavior:calm?"auto":"smooth"});
    });
  }
  let touched=false; ["pointerdown","keydown"].forEach(t=>window.addEventListener(t,()=>{touched=true},{capture:true,passive:true}));
  function showQuestion(){
    requestAnimationFrame(()=>{
      const card=document.querySelector(".wrap>.room,.wrap>.nest");
      const top=card?(parseFloat(getComputedStyle(card).top)||0)+card.offsetHeight:0;
      const r=q.getBoundingClientRect();
      if(r.top<top+4 || r.top>window.innerHeight*0.6) window.scrollTo({top:Math.max(0,window.scrollY+r.top-top-10),behavior:calm?"auto":"smooth"});
    });
  }
  const sea=document.getElementById("sea");
  if(sea){
    const st=()=>{ const b=document.getElementById("bossBtn"), n=sea.querySelector(".isle-name"); return {on:!!(b&&!b.disabled), isle:n?n.textContent:""}; };
    let prev=st();
    new MutationObserver(()=>{
      const cur=st();
      if(touched && cur.on && !prev.on && cur.isle===prev.isle){
        const row=sea.querySelector(".bossrow"), b=document.getElementById("bossBtn");
        setTimeout(()=>{
          const card=document.querySelector(".wrap>.room,.wrap>.nest");
          const top=card?(parseFloat(getComputedStyle(card).top)||0)+card.offsetHeight:0;
          const r=(row||b).getBoundingClientRect();
          window.scrollTo({top:Math.max(0,window.scrollY+r.top-top-16),behavior:calm?"auto":"smooth"});
          if(b){ b.classList.add("bosscall"); }
        },700);
      }
      prev=cur;
    }).observe(sea,{childList:true,subtree:true});
  }
  new MutationObserver(ms=>{
    for(const m of ms) for(const n of m.addedNodes){
      if(n.nodeType!==1) continue;
      const fb=n.matches(".feedback")?n:(n.querySelector&&n.querySelector(".feedback"));
      if(!fb) continue;
      if(fb.querySelector(".res.ok")){ const b=box(); if(b){ b.classList.remove("kjump"); void b.offsetWidth; b.classList.add("kjump"); setTimeout(()=>b.classList.remove("kjump"),900); } }
      showResult(fb); return;
    }
    if(touched && ms.some(m=>m.target===q && m.addedNodes.length)) showQuestion();
  }).observe(q,{childList:true,subtree:true});
})();
</script>

// ---------- あそびばパネル ----------
const quiz=document.getElementById("quiz");
const zone=document.createElement("section");
zone.className="card pz"; zone.id="playZone"; zone.setAttribute("aria-label","あそびば");
quiz.after(zone);
function renderZone(){
  const t=tickets(), left=EVERY-(state.correct%EVERY);
  zone.innerHTML=`<h2>🎪 あそびば</h2>
    <p class="pz-t">あそびけん <b>${t}</b> まい<small>${t?"1まいで 1かい あそべるよ":"あと "+left+"もん せいかいすると 1まい もらえるよ"}（${EVERY}もん せいかいで 1まい）</small></p>
    <div class="pz-games">${GAMES.map(g=>`<button type="button" class="pz-g" data-g="${g.id}" ${t?"":"disabled"}><span class="i" aria-hidden="true">${g.icon}</span><b>${g.name}</b>${ps.best[g.id]!=null?`<small>さいこう ${ps.best[g.id]}${g.unit}</small>`:""}</button>`).join("")}</div>`;
  zone.querySelectorAll(".pz-g").forEach(b=>b.addEventListener("click",()=>openGame(b.dataset.g)));
}
renderZone();

let lastCorrect=state.correct;
new MutationObserver(()=>{
  if(state.correct!==lastCorrect){
    const got=Math.floor(state.correct/EVERY)>Math.floor(lastCorrect/EVERY);
    lastCorrect=state.correct; renderZone();
    if(got){ const fb=quiz.querySelector(".feedback .res.ok"); if(fb && !fb.parentNode.querySelector(".pz-get")){ const d=document.createElement("div"); d.className="pz-get"; d.textContent="🎟 あそびけんを 1まい ゲット！ したの「あそびば」で あそべるよ"; fb.after(d); } }
  } else if(tickets()!==+((zone.querySelector(".pz-t b")||{}).textContent)) renderZone();
}).observe(quiz,{childList:true,subtree:true});

// ---------- ゲームの まど ----------
let ov=null, cleanup=[];
function later(fn,ms){ const id=setTimeout(fn,ms); cleanup.push(()=>clearTimeout(id)); return id; }
function every(fn,ms){ const id=setInterval(fn,ms); cleanup.push(()=>clearInterval(id)); return id; }
function frame(fn){ let on=true; const loop=t=>{ if(!on) return; fn(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop); cleanup.push(()=>{on=false}); }
function stopAll(){ cleanup.forEach(f=>f()); cleanup=[]; }
function closeGame(){ stopAll(); if(ov){ ov.remove(); ov=null; } document.documentElement.style.overflow=""; document.body.style.overflow=""; renderZone(); const b=zone.querySelector(".pz-g"); if(b) b.focus({preventScroll:true}); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&ov) closeGame(); });

function openGame(id){
  const g=GAMES.find(x=>x.id===id); if(!g||tickets()<1) return;
  ps.used++; saveP();
  ov=document.createElement("div"); ov.className="pz-ov";
  ov.innerHTML=`<div class="pz-box ${CH}" role="dialog" aria-modal="true" aria-label="${esc(g.name)}">
    <div class="pz-head"><b>${g.icon} ${esc(g.name)}</b><span class="pz-score" aria-live="polite"></span><button type="button" class="pz-x">おわる</button></div>
    <div class="pz-time" hidden><i></i></div>
    <div class="pz-stage"></div>
    <p class="pz-msg">${esc(g.desc)}</p>
    <div class="pz-ctl"></div></div>`;
  document.body.appendChild(ov);
  document.documentElement.style.overflow="hidden"; document.body.style.overflow="hidden";
  ov.querySelector(".pz-x").addEventListener("click",closeGame);
  const api={
    g, stage:ov.querySelector(".pz-stage"), msg:ov.querySelector(".pz-msg"), ctl:ov.querySelector(".pz-ctl"),
    score(v){ ov.querySelector(".pz-score").textContent=v+g.unit; },
    timer(sec,onEnd){ const bar=ov.querySelector(".pz-time"); bar.hidden=false; const i=bar.querySelector("i"); const t0=performance.now();
      frame(t=>{ const r=Math.max(0,1-(t-t0)/(sec*1000)); i.style.width=(r*100)+"%"; }); later(onEnd,sec*1000); },
    end(v){ stopAll(); const old=ps.best[g.id]; const better=old==null||(g.low?v<old:v>old);
      if(better){ ps.best[g.id]=v; saveP(); }
      const left=tickets();
      const e=document.createElement("div"); e.className="pz-end";
      e.innerHTML=`<div>${g.low?"ぜんぶ そろった！":"おしまい！"}</div><div class="n">${v}${g.unit}</div>
        <div class="best">${better&&old!=null?'<span class="new">さいこう きろく こうしん！</span>':"さいこう "+(ps.best[g.id])+g.unit}</div>
        <div class="best">あそびけん のこり ${left}まい</div>
        <button type="button" class="pz-big" style="margin-top:8px;min-width:12em">${left?"もういちど あそぶ":"もどる"}</button>
        ${left?'<button type="button" class="pz-x" style="margin-top:4px">もどる</button>':""}`;
      api.stage.appendChild(e); api.ctl.innerHTML="";
      const [again,back]=e.querySelectorAll("button");
      again.addEventListener("click",()=>{ if(left){ closeGame(); openGame(g.id); } else closeGame(); });
      if(back) back.addEventListener("click",closeGame);
      again.focus({preventScroll:true});
    }
  };
  ({feed,cups,memory,target,hoi,treasure})[id](api);
  ov.querySelector(".pz-x").focus({preventScroll:true});
}

// ---------- ペンギン：さかなを あげよう ----------
function feed(a){
  let n=0; a.score(0);
  a.stage.innerHTML=`<div class="pz-chr">${charSVG()}</div>`;
  const chr=a.stage.querySelector(".pz-chr");
  function spawn(){
    const W=a.stage.clientWidth, H=a.stage.clientHeight;
    const s=document.createElement("button"); s.type="button"; s.className="pz-seed"+(CH==="hamster"?" f"+[0,1,2,4,5][Math.floor(Math.random()*5)]:""); s.setAttribute("aria-label",CH==="hamster"?"さかな":"たね");
    s.style.left=(30+Math.random()*(W-60))+"px"; s.style.top=(30+Math.random()*(H-180))+"px";
    s.addEventListener("pointerdown",e=>{ e.preventDefault(); if(s.classList.contains("fly")) return;
      n++; a.score(n); s.classList.add("fly"); s.style.left=(W/2)+"px"; s.style.top=(H-80)+"px";
      setTimeout(()=>{ s.remove(); chr.classList.remove("munch"); void chr.offsetWidth; chr.classList.add("munch"); },340); });
    a.stage.appendChild(s);
    later(()=>{ if(!s.classList.contains("fly")) s.remove(); },1700);
  }
  spawn(); every(spawn,650); later(spawn,300);
  a.timer(20,()=>a.end(n));
}

// ---------- ペンギン：どこかな？（かまくらの シャッフル） ----------
function cups(a){
  const R=5; let round=0, got=0; a.score(0);
  a.stage.innerHTML=`<div class="pz-floor"></div>`+[0,1,2].map(i=>`<div class="pz-cupw" data-c="${i}"><div class="ham">${i===0?charSVG():""}</div><button type="button" class="cup" aria-label="かまくら ${i+1}" disabled></button></div>`).join("");
  const W=()=>a.stage.clientWidth, X=s=>W()*(0.2+0.3*s);
  const ws=[...a.stage.querySelectorAll(".pz-cupw")]; let slot=[0,1,2]; let hamCup=0;
  const place=()=>ws.forEach((w,i)=>w.style.left=X(slot[i])+"px");
  const cupsBtn=ws.map(w=>w.querySelector(".cup"));
  const big=t=>{ const d=document.createElement("div"); d.className="pz-big-t"; d.textContent=t; a.stage.appendChild(d); later(()=>d.remove(),900); };
  a.ctl.innerHTML=`<button type="button" class="pz-big" style="width:100%">スタート！</button>`;
  const go=a.ctl.querySelector("button");
  place();
  function startRound(){
    go.hidden=true; ws.forEach(w=>w.classList.remove("pick"));
    hamCup=rnd(3); ws.forEach((w,i)=>w.querySelector(".ham").innerHTML=i===hamCup?charSVG():"");
    a.msg.textContent=`${round+1}かいめ：ペンギンは この かまくらに はいるよ。よく みてね！`;
    cupsBtn.forEach(c=>{ c.disabled=true; c.classList.remove("up"); });
    cupsBtn[hamCup].classList.add("up");
    later(()=>{ cupsBtn[hamCup].classList.remove("up"); later(shuffleCups,500); },1300);
  }
  function shuffleCups(){
    a.msg.textContent="まぜまぜ……";
    const n=3+round*2, dur=Math.max(220,480-round*60);
    ws.forEach(w=>w.style.transitionDuration=dur+"ms");
    let k=0;
    const step=()=>{ if(k++>=n){ ask(); return; }
      let i=rnd(3), j=rnd(2); if(j>=i) j++;
      [slot[i],slot[j]]=[slot[j],slot[i]]; place(); later(step,dur+60); };
    step();
  }
  function ask(){
    a.msg.textContent="ペンギンは どこかな？ かまくらを タッチしてね";
    cupsBtn.forEach(c=>c.disabled=false);
  }
  cupsBtn.forEach((c,i)=>c.addEventListener("click",()=>{
    cupsBtn.forEach(x=>x.disabled=true); ws[i].classList.add("pick");
    c.classList.add("up");
    const ok=i===hamCup;
    if(ok){ got++; a.score(got); big("みつけた！"); a.msg.textContent="あたり！ よく みていたね"; }
    else { later(()=>cupsBtn[hamCup].classList.add("up"),500); big("ざんねん"); a.msg.textContent="ペンギンは こっちに いたよ"; }
    round++;
    later(()=>{ if(round>=R){ a.end(got); return; } cupsBtn.forEach(x=>x.classList.remove("up")); later(startRound,450); },1800);
  }));
  go.addEventListener("click",startRound);
  a.msg.textContent=`ペンギンが はいった かまくらを、さいごまで めで おいかけよう！ ぜんぶで ${R}かい`;
}

// ---------- しんけいすいじゃく ----------
function yomiLabel(t){ const parts=String(t.yomi||"").split(/[・、,]/).map(s=>s.trim()).filter(Boolean); return parts.find(p=>/^[ぁ-ゖー（）()]+$/.test(p))||parts[0]||""; }
function memory(a){
  let P=[]; try{ P=(typeof ALL!=="undefined"&&ALL)||(typeof KANJI!=="undefined"&&KANJI)||pool0(); }catch(e){}
  const seenK=new Set(Object.keys(state.st||{}));
  let cand=shuffle(P.filter(t=>seenK.has(t.k))); if(cand.length<6) cand=cand.concat(shuffle(P.filter(t=>!seenK.has(t.k))));
  const pick=[], used=new Set();
  for(const t of cand){ const y=yomiLabel(t); if(!y||used.has(y)) continue; used.add(y); pick.push({k:t.k,y}); if(pick.length===6) break; }
  const cards=shuffle(pick.flatMap((p,i)=>[{i,txt:p.k,kind:"k"},{i,txt:p.y,kind:"y"}]));
  a.stage.innerHTML=`<div class="pz-mem">${cards.map((c,j)=>`<button type="button" class="pz-card" data-j="${j}" aria-label="カード">？</button>`).join("")}</div>`;
  let open=[], tries=0, done=0, busy=false; a.score(0);
  a.msg.textContent="かんじと その よみかたの カードを そろえよう";
  a.stage.querySelectorAll(".pz-card").forEach(b=>b.addEventListener("click",()=>{
    const c=cards[+b.dataset.j]; if(busy||b.classList.contains("open")) return;
    b.classList.add("open",c.kind); b.textContent=c.txt; b.setAttribute("aria-label",c.txt); open.push([b,c]);
    if(open.length<2) return;
    tries++; a.score(tries);
    const [[b1,c1],[b2,c2]]=open; open=[];
    if(c1.i===c2.i){ b1.classList.add("done"); b2.classList.add("done"); done++;
      a.msg.textContent=`「${pick[c1.i].k}」は「${pick[c1.i].y}」！`;
      a.stage.querySelectorAll(".pz-cheer").forEach(x=>x.remove());
      const ch=document.createElement("div"); ch.className="pz-cheer"; ch.setAttribute("aria-hidden","true");
      ch.innerHTML=`<div class="bub">せいかい！<br><b>${esc(pick[c1.i].k)}</b> ＝ ${esc(pick[c1.i].y)}</div><div class="c">${charSVG()}</div>`;
      a.stage.appendChild(ch); later(()=>ch.remove(),1400);
      if(done===pick.length) later(()=>a.end(tries),700);
    } else { busy=true; later(()=>{ [b1,b2].forEach((x,k)=>{ x.classList.add("bad"); }); },350);
      later(()=>{ [b1,b2].forEach(x=>{ x.classList.remove("open","k","y","bad"); x.textContent="？"; x.setAttribute("aria-label","カード"); }); busy=false; },1000); }
  }));
}

// ---------- ドラゴン：ほのおで まとあて ----------
function target(a){
  let n=0; a.score(0);
  a.stage.innerHTML=`<div class="pz-chr">${charSVG()}</div>`;
  const chr=a.stage.querySelector(".pz-chr");
  function spawn(){
    const W=a.stage.clientWidth, H=a.stage.clientHeight;
    const s=document.createElement("button"); s.type="button"; s.className="pz-tgt"; s.setAttribute("aria-label","まと");
    const x=40+Math.random()*(W-80), y=40+Math.random()*(H-190);
    s.style.left=x+"px"; s.style.top=y+"px";
    s.addEventListener("pointerdown",e=>{ e.preventDefault(); if(s.classList.contains("hit")) return;
      n++; a.score(n); s.classList.add("hit");
      const f=document.createElement("span"); f.className="pz-fire"; f.textContent=CH==="pirate"?"💥":"🔥"; f.style.left=x+"px"; f.style.top=y+"px"; a.stage.appendChild(f);
      setTimeout(()=>{ s.remove(); f.remove(); },500);
      chr.classList.remove("munch"); void chr.offsetWidth; chr.classList.add("munch"); });
    a.stage.appendChild(s);
    later(()=>{ if(!s.classList.contains("hit")) s.remove(); },1300);
  }
  spawn(); every(spawn,700);
  a.timer(20,()=>a.end(n));
}

// ---------- かいぞく：たからさがし ----------
function treasure(a){
  const N=25, T=3, DIG=10; const gold=new Set(); while(gold.size<T) gold.add(rnd(N));
  let digs=0, found=0; a.score(0);
  a.stage.innerHTML=`<div class="pz-sand">${Array.from({length:N},(_,i)=>`<button type="button" data-i="${i}" aria-label="すな ${i+1}"></button>`).join("")}</div>`;
  const near=i=>{ const x=i%5,y=Math.floor(i/5); for(const g of gold){ if(Math.abs(g%5-x)<=1&&Math.abs(Math.floor(g/5)-y)<=1) return true; } return false; };
  a.msg.textContent=`のこり ${DIG}かい ほれるよ。オレンジの すなは たからの ちかく！`;
  a.stage.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("dug")||digs>=DIG) return;
    const i=+b.dataset.i; digs++; b.classList.add("dug");
    if(gold.has(i)){ found++; b.classList.add("gold"); a.score(found); a.msg.textContent="たからを みつけた！"; }
    else { const h=near(i); if(h) b.classList.add("hot"); a.msg.textContent=(h?"ちかいぞ！ ":"")+`のこり ${DIG-digs}かい`; }
    if(found===T||digs>=DIG){ a.stage.querySelectorAll("button").forEach(x=>{ if(gold.has(+x.dataset.i)&&!x.classList.contains("gold")){ x.classList.add("dug","gold"); x.style.opacity=.5; } });
      later(()=>a.end(found),900); }
  }));
}

function look(svg,dir){
  if(!svg) return;
  const F={right:[15,2,8],left:[-15,2,-8],up:[0,-14,0],down:[0,12,0]}[dir]||[0,0,0];
  svg.querySelector(".hd").style.transform=`rotate(${F[2]}deg)`;
  svg.querySelector(".ft").style.transform=`translate(${F[0]}px,${F[1]}px)`;
  svg.querySelector(".pu").style.transform=`translate(${F[0]*.25}px,${F[1]*.25}px)`;
}

// ---------- あっちむいて ホイ ----------
function hoi(a){
  // 手は はだの いろに しない（ユニバーサルデザイン、MAさん 2026-11-23）：しろい てぶくろの 絵
  const HS='fill="#FFFFFF" stroke="#2A2430" stroke-width="2.2" stroke-linejoin="round"';
  const HAND=deg=>`<svg class="hand" viewBox="0 0 40 40" width="1.45em" height="1.45em" aria-hidden="true" style="vertical-align:-.25em"><g transform="rotate(${deg} 20 20)"><rect x="15.5" y="2" width="9" height="20" rx="4.5" ${HS}/><rect x="10" y="16" width="20" height="15" rx="6" ${HS}/><path d="M10.5 22q-4-1-4.5 3t4.5 4" ${HS}/><path d="M16 20v5M21 20v5M26 20v5" stroke="#2A2430" stroke-width="1.6" stroke-linecap="round"/><rect x="12" y="30" width="16" height="6" rx="2" fill="#8EC9F0" stroke="#2A2430" stroke-width="2.2"/></g></svg>`;
  const PALM=`<svg class="hand" viewBox="0 0 40 40" width="1.25em" height="1.25em" aria-hidden="true" style="vertical-align:-.2em"><path d="M12 30V14a2.5 2.5 0 015 0v-4a2.5 2.5 0 015 0v-1a2.5 2.5 0 015 0v3a2.5 2.5 0 015 0v13q0 6-6 8h-8q-4-1-6-5l-4-6a2.4 2.4 0 014-3l1 1z" ${HS}/><path d="M17 14v8M22 10v12M27 11v11" stroke="#2A2430" stroke-width="1.4" stroke-linecap="round"/></svg>`;
  const DIR={up:["⬆️","うえ",HAND(0)],down:["⬇️","した",HAND(180)],left:["⬅️","ひだり",HAND(-90)],right:["➡️","みぎ",HAND(90)]};
  const KEYS=["up","down","left","right"], R=6; let round=0, pts=0; const res=[]; a.score(0);
  // むきごとの絵（MAさんの絵 hoi2-<kind>-<front|right|left|down>.png）。うえ は正面の絵をそらせる
  const HSRC=(k,d)=>`hoi2-${k}-${d}.png?v=1`;
  ["kid",CH].forEach(k=>["front","right","left","down"].forEach(d=>{const i=new Image(); i.src=HSRC(k,d);}));
  function turn(el,kind,dir){
    el.src=HSRC(kind,(!dir||dir==="up")?"front":dir);
    el.style.transform=dir==="up"?"perspective(420px) translateY(-9%) rotateX(24deg) scale(1.04)":"";
    el.classList.remove("pop"); void el.offsetWidth; if(dir) el.classList.add("pop");
  }
  a.stage.innerHTML=`<div class="pz-hoi">
      <div class="pz-mode"></div>
      <div class="pz-vs">
        <div class="pz-side"><span class="who">きみ</span><div class="pic"><img class="kidimg" src="hoi2-kid-front.png?v=1" alt=""></div><span class="badge mb"></span><span class="what mew"></span></div>
        <span class="pz-vsx">VS</span>
        <div class="pz-side"><span class="who">${esc(NAME)}</span><div class="pic"><img class="chimg" src="hoi2-${CH}-front.png?v=1" alt=""></div><span class="badge cb"></span><span class="what cw"></span></div>
      </div>
      <div class="pz-dots">${Array.from({length:R},()=>"<i></i>").join("")}</div>
    </div>
    <div class="pz-rule"><h3>↗️ あっちむいて ホイ のルール</h3>
      <p><b>⚔️ こうげきの ばん</b>：やじるしで ゆびを さそう。${esc(NAME)}が <b>おなじ むき</b>を むいたら かち！</p>
      <p><b>🛡 ぼうぎょの ばん</b>：${esc(NAME)}が ゆびを さすよ。<b>ちがう むき</b>を むけたら かち！</p>
      <p>こうげきと ぼうぎょを こうたいで ${R}かい。かった かずが てんすうだよ。</p>
      <button type="button" class="pz-big">はじめる</button></div>`;
  const $q=sel=>a.stage.querySelector(sel);
  const mode=$q(".pz-mode"), kid=$q(".kidimg"), chi=$q(".chimg"), mb=$q(".mb"), mew=$q(".mew"), cw=$q(".cw"), cb=$q(".cb"), dots=[...a.stage.querySelectorAll(".pz-dots i")];
  a.ctl.innerHTML=`<div class="pz-arrows">${KEYS.map(k=>`<button type="button" data-d="${k}" disabled><b>${DIR[k][0]}</b>${DIR[k][1]}</button>`).join("")}<span class="mid" aria-hidden="true"></span></div>`;
  const btns=[...a.ctl.querySelectorAll("button")], mid=a.ctl.querySelector(".mid");
  const lock=v=>btns.forEach(b=>b.disabled=v);
  const big=t=>{ const d=document.createElement("div"); d.className="pz-big-t pz-hoi-t"; d.textContent=t; const m=$q(".pz-mode"); if(m){ d.style.top=m.offsetTop+"px"; d.style.height=m.offsetHeight+"px"; d.style.background=getComputedStyle(m).backgroundColor; } a.stage.appendChild(d); later(()=>d.remove(),800); };
  function setup(){
    if(round>=R){ a.end(pts); return; }
    const atk=round%2===0;
    dots.forEach((d,i)=>{ d.className=res[i]===true?"w":res[i]===false?"l":i===round?"now":""; d.textContent=res[i]===true?"○":res[i]===false?"×":""; });
    mode.className="pz-mode "+(atk?"atk":"def");
    mode.innerHTML=atk?`⚔️ ${round+1}かいめ：きみの こうげき<small>ゆびを さそう。${esc(NAME)}が おなじ むきを むいたら かち！</small>`
                      :`🛡 ${round+1}かいめ：きみの ぼうぎょ<small>${esc(NAME)}が ゆびを さすよ。ちがう むきを むこう！</small>`;
    turn(kid,"kid",""); turn(chi,CH,""); mb.innerHTML=atk?PALM:""; cb.innerHTML=atk?"":PALM; mew.textContent=atk?"どっちを さす？":"どっちを むく？"; cw.textContent="";
    btns.forEach(b=>{ const k=b.dataset.d; b.innerHTML=`<b>${atk?DIR[k][2]:DIR[k][0]}</b>${DIR[k][1]}${atk?"を さす":"を むく"}`; });
    a.msg.textContent=atk?"どっちに ゆびを さす？":"どっちを むく？";
    mid.innerHTML=atk?PALM:"🙂";
    lock(false);
  }
  btns.forEach(b=>b.addEventListener("click",()=>{
    const my=b.dataset.d, its=KEYS[rnd(4)], atk=round%2===0; lock(true);
    a.msg.textContent="あっち むいて……"; big("あっち むいて…");
    later(()=>{
      big("ホイ！");
      if(atk){ mb.innerHTML=DIR[my][2]; mew.textContent=DIR[my][1]+"を さした";
        turn(chi,CH,its); cb.textContent=DIR[its][0]; cw.textContent=DIR[its][1]+"を むいた"; }
      else { cb.innerHTML=DIR[its][2]; cw.textContent=DIR[its][1]+"を さした";
        turn(kid,"kid",my); mb.textContent=DIR[my][0]; mew.textContent=DIR[my][1]+"を むいた"; }
      const win=atk?my===its:my!==its; res[round]=win; if(win) pts++; a.score(pts);
      later(()=>{ a.msg.textContent=atk?(win?"おなじ むき！ きみの かち！ 1てん":"ちがう むきだった。ざんねん"):(win?"よけた！ きみの かち！ 1てん":"おなじ むきを むいちゃった…ざんねん");
        big(win?"かち！":"まけ…"); },650);
      round++; later(setup,2400);
    },700);
  }));
  $q(".pz-rule .pz-big").addEventListener("click",()=>{ $q(".pz-rule").remove(); setup(); });
}

// ---------- パイレーツ・ユニコーン：ボス戦のかわりに、ぜんぶ みつけたら つぎへ ----------
if((CH==="pirate"||CH==="unicorn") && typeof renderSea==="function"){
  const PLACE=CH==="pirate"?"しま":"くに";
  const css2=document.createElement("style"); css2.textContent=`.sea .bossrow.nb{display:block;text-align:center;padding:12px}.sea .bossrow.nb p{margin:0}`; document.head.appendChild(css2);
  let justCleared=null;
  const orig=renderSea;
  renderSea=function(){
    if(state.boss){ state.boss=null; save(); }
    const i=state.sec, sec=SECS[i];
    if(sec && secFound(i)>=sec.length && state.cleared<=i){ state.cleared=i+1; save(); justCleared=i; }
    const r=orig.apply(this,arguments);
    const row=document.querySelector("#sea .bossrow");
    if(row && sec){
      const n=secFound(i), clr=i<state.cleared, last=i>=SEC_N-1;
      row.className="bossrow nb";
      row.innerHTML=`<p>${clr?(last?"🎉 ぜんぶの "+PLACE+"を クリアした！ おめでとう！":"🎉 クリア！ つぎの "+PLACE+"へ いけるよ。うえの ちずから えらんでね"):`この ${PLACE}の かんじを ぜんぶ みつけると、つぎの ${PLACE}へ いけるよ（あと ${sec.length-n}じ）`}</p>`;
    }
    if(justCleared!=null){ const jc=justCleared; justCleared=null; setTimeout(()=>{ const fb=quiz.querySelector(".feedback .res.ok"); if(fb && !fb.parentNode.querySelector(".pz-clear")){ const d=document.createElement("div"); d.className="pz-get pz-clear"; d.textContent=`🎉 「${isleName(jc)}」を クリア！ ${jc>=SEC_N-1?"ぜんぶ クリア！":"つぎの "+PLACE+"へ いけるよ"}`; fb.after(d); } },0); }
    return r;
  };
  if(state.boss){ state.boss=null; save(); try{ renderQuestion(); }catch(e){} }
  try{ renderSea(); }catch(e){}
}
})();
